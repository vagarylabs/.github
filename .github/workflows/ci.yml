# Lint the org's reusable workflows with actionlint.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  actionlint:
    # Approved public-repository Ubuntu profile (2026-10-13); private caller placement remains separate.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          mapfile -t pins < <(awk '$1 == "actionlint" && $2 == "1.7.7" { print }' release-assets.lock)
          [ "${#pins[@]}" -eq 1 ] || { echo "Expected one locked actionlint 1.7.7 asset" >&2; exit 1; }
          read -r ASSET_TOOL ASSET_VERSION ASSET_URL ASSET_SHA256 extra <<< "${pins[0]}"
          [ -z "$extra" ] || { echo "Malformed actionlint lock entry" >&2; exit 1; }
          export ASSET_TOOL ASSET_VERSION ASSET_URL ASSET_SHA256
          export ASSET_DEST="$RUNNER_TEMP/actionlint.tar.gz"
          export RUNNER_TOOL_CACHE="$RUNNER_TEMP/actionlint-cache"
          bash actions/fetch-release-asset/fetch.sh
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$ASSET_DEST" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          lint="$RUNNER_TEMP/actionlint-bin/actionlint"
          invalid="$RUNNER_TEMP/actionlint-invalid.yml"
          {
            printf '%s\n' 'name: actionlint rejection control' 'on: workflow_dispatch' 'jobs:' \
              '  proof:' '    runs-on: ubuntu-latest' '    steps:' \
              '      - id: known_step' '        run: echo known' '      - name: invalid expression'
            # Construct the expression as fixture data; the enclosing workflow must not evaluate it.
            printf '        run: echo "%s{{ steps.proof_missing_step.outputs.value }}"\n' '$'
          } > "$invalid"
          negative_status=0
          "$lint" -oneline "$invalid" > "$RUNNER_TEMP/actionlint-invalid.log" 2>&1 || negative_status=$?
          [ "$negative_status" -eq 1 ] || { echo "Expected actionlint lint rejection, not a tool failure" >&2; exit 1; }
          grep -F 'property "proof_missing_step" is not defined' "$RUNNER_TEMP/actionlint-invalid.log"
          grep -F '[expression]' "$RUNNER_TEMP/actionlint-invalid.log"
          # The two workflows that inline trusted/classify.py carry run scripts over 64 KiB. actionlint writes a script
          # to the stdin of its shellcheck process before starting that process, so a script larger than the pipe
          # buffer blocks it forever. That write is code the pinned 1.7.7 and 1.7.12 share: process.go,
          # cmdExecution.run calls io.WriteString on the stdin pipe, then cmd.Output() (read in both tags' source).
          # REPRODUCED on 1.7.12 only, on the ~93 KB run script: no shellcheck child is ever started and actionlint
          # never returns. On 1.7.7 the hang is INFERRED from that shared code, not run. Do NOT re-enable the shellcheck
          # integration for these two. This required job still gates their run scripts on shellcheck: the step below
          # runs it on every one of them directly and fails when shellcheck is missing.
          shopt -s nullglob
          inline=(.github/workflows/trusted-workflow-integrity.yml .github/workflows/trusted-protected-paths.yml)
          rest=()
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            case " ${inline[*]} " in *" $f "*) ;; *) rest+=("$f") ;; esac
          done
          "$lint" -color "${rest[@]}"
          "$lint" -color -shellcheck= "${inline[@]}"
          # The trust-root run scripts are gated by shellcheck in this required job: the trusted-tests check, with
          # TRUSTED_REQUIRE_SHELLCHECK=1 turning its skip (no shellcheck on PATH) into a failure. Named exactly, so a
          # renamed test errors instead of running nothing.
          (cd trusted/tests && TRUSTED_REQUIRE_SHELLCHECK=1 python3 -m unittest -v \
            test_trusted.WorkflowTests.test_inline_workflow_run_scripts_pass_shellcheck)
          # Every run, the number the split above exists for: each workflow's largest INLINE run script (what the
          # 64 KiB stdin limit applies to), next to that limit.
          {
            echo "### Inline run script sizes"
            python3 -I trusted/inline_scripts.py sizes "${inline[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
      # C1 workflow-lint live vectors (root's R4 of #41, B1): the real zizmor and actionlint, with the exact flags the
      # rendered trusted-workflow-integrity.yml passes, are not quietened by a PR's zizmor.yml, ignore comment,
      # .gitignore or actionlint.yaml. C1_REQUIRE_TOOLS=1 turns the local skip into a failure. Named exactly.
      - name: C1 workflow-lint live vectors (real zizmor 1.31.1 and actionlint 1.7.7)
        run: |
          set -euo pipefail
          mapfile -t pins < <(awk '$1 == "zizmor" && $2 == "1.31.1" { print }' release-assets.lock)
          [ "${#pins[@]}" -eq 1 ] || { echo "Expected one locked zizmor 1.31.1 asset" >&2; exit 1; }
          read -r ASSET_TOOL ASSET_VERSION ASSET_URL ASSET_SHA256 extra <<< "${pins[0]}"
          [ -z "$extra" ] || { echo "Malformed zizmor lock entry" >&2; exit 1; }
          export ASSET_TOOL ASSET_VERSION ASSET_URL ASSET_SHA256
          export ASSET_DEST="$RUNNER_TEMP/zizmor.tar.gz" ASSET_MAX_TIME=90
          export RUNNER_TOOL_CACHE="$RUNNER_TEMP/zizmor-cache"
          bash actions/fetch-release-asset/fetch.sh
          mkdir -p "$RUNNER_TEMP/zizmor-bin"
          tar -xzf "$ASSET_DEST" -C "$RUNNER_TEMP/zizmor-bin" zizmor
          (cd trusted/tests && C1_REQUIRE_TOOLS=1 C1_ZIZMOR="$RUNNER_TEMP/zizmor-bin/zizmor" \
            C1_ACTIONLINT="$RUNNER_TEMP/actionlint-bin/actionlint" python3 -m unittest -v test_c1_live.LiveVectors)

  planner-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: change-impact planner unit tests
        run: |
          python3 -m unittest discover -s actions/change-impact-plan -p 'test_*.py' -v
          python3 -m unittest discover -s actions/changed-tests-plan -p 'test_*.py' -v
          python3 -m unittest discover -s distribution -p 'test_*.py' -v

  fetch-release-asset-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: fetch-release-asset tests (curl stubbed; private temp cache) and release-assets.lock lint
        run: bash actions/fetch-release-asset/test_fetch.sh

  sibling-repo-read-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: sibling-repo-read tests (a localhost API stub and local bare remotes; no network, no real token)
        run: python3 -m unittest discover -s actions/sibling-repo-read -p 'test_*.py' -v
      # An App-key-free run on a real runner (root's ruling 2026-10-29, core sibling-read path (a)): no app-id, no
      # private-key, no secret; a token directory shaped exactly as broker-source-read writes it, holding a fake
      # credential. bulk is public, so git reads it without asking the credential helper. What this proves is the
      # composition on the runner: the source check, no mint, no readiness wait, the read step in its reset shell.
      - name: Write a broker-shaped token directory (a fake credential, never a real one)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/broker-tokens"
          install -d -m 700 "$d"
          umask 077
          printf '%s' 'fake-public-read-not-a-credential' > "$d/vagarylabs__bulk"
      - name: sibling-repo-read in token-dir mode, App-key-free
        uses: ./actions/sibling-repo-read
        with:
          token-dir: ${{ runner.temp }}/broker-tokens
          repositories: bulk
          checkouts: bulk:${{ runner.temp }}/siblings/bulk
      - name: The App-key-free checkout is main's commit, and the token file is left for broker-source-read's revoke
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/siblings/bulk/README.md"
          test "$(git -C "$RUNNER_TEMP/siblings/bulk" rev-parse HEAD)" = "$(git ls-remote https://github.com/vagarylabs/bulk refs/heads/main | cut -f1)"
          test -f "$RUNNER_TEMP/broker-tokens/vagarylabs__bulk"
      # The two-phase sparse read against GitHub's own server (it must honour --filter=blob:none, or the tree phase
      # refuses): the tree phase, a pattern set (here written by hand; vagary-core derives it), the sparse phase.
      - name: sibling-repo-read sparse, phase 1 (commits and trees only)
        id: bulk_tree
        uses: ./actions/sibling-repo-read
        with:
          token-dir: ${{ runner.temp }}/broker-tokens
          repositories: bulk
          trees: bulk:${{ runner.temp }}/siblings/bulk-sparse
      - name: Derive a pattern set from the tree listing (the consumer's step)
        env:
          TREES: ${{ steps.bulk_tree.outputs.trees }}
        run: |
          set -euo pipefail
          tree=$(python3 -c 'import json, os; print(json.loads(os.environ["TREES"])["bulk"]["tree"])')
          tr '\0' '\n' < "$tree" | grep -qx README.md
          tr '\0' '\n' < "$tree" | grep -qx Dockerfile
          printf '/README.md\n' > "$RUNNER_TEMP/bulk-patterns.txt"
      - name: sibling-repo-read sparse, phase 2 (exactly the set)
        id: bulk_sparse
        uses: ./actions/sibling-repo-read
        with:
          token-dir: ${{ runner.temp }}/broker-tokens
          repositories: bulk
          sparse: bulk:${{ runner.temp }}/siblings/bulk-sparse:${{ runner.temp }}/bulk-patterns.txt
      - name: Only the set is materialized, nothing outside it is fetched, and sparse-ok names bulk
        env:
          SPARSE_OK: ${{ steps.bulk_sparse.outputs.sparse-ok }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/siblings/bulk-sparse"
          test "$SPARSE_OK" = bulk
          test -s "$d/README.md"
          test ! -e "$d/Dockerfile"
          dockerfile=$(git -C "$d" rev-parse HEAD:Dockerfile)
          if git -C "$d" cat-file --batch-all-objects --batch-check='%(objectname)' | grep -qx "$dockerfile"; then
            echo "::error::a blob outside the sparse set (Dockerfile) was fetched"; exit 1
          fi
          test -z "$(git -C "$d" remote)"

  broker-source-read-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: broker-source-read tests (a fake OIDC, STS, IAM, broker and GitHub API; no network, no real credential)
        run: python3 -m unittest discover -s actions/broker-source-read -p 'test_*.py' -v

  scorecard-report-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: scorecard-weekly helper tests, embedded-copy drift and release-assets.lock pin (localhost API stub; no network, no real token)
        run: python3 -m unittest discover -s scripts -p 'test_scorecard*.py' -v

  secret-scan-scope-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: secret-scan-scope tests (local bare origin; git and python3 only, no scanners, no network)
        run: bash actions/secret-scan-scope/test_scope.sh

  timeout-floor-self-scan:
    # The floor's own repo. The org ruleset's trusted timeout-floor job skips vagarylabs/.github (this public repo has
    # no bridge runner), so without this job the rule would never see the one repo that defines it. Same classify.py
    # mode and manifest, on this repo's HEAD tree, in the manifest's mode (report today: fails only on an integrity
    # error, exactly as in every other repo). Like the ruleset job it reads the head tree only: the head commit alone
    # (fetch-depth 1; the PR head, not the default merge commit), and no base.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: timeout floor on this repo's HEAD tree
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I trusted/classify.py timeout-floor --manifest trusted/manifest.json \
            --repo "$GITHUB_REPOSITORY" --head "$HEAD_SHA"

  trusted-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: trusted ruleset workflows (manifest, classifier, render drift, invariants)
        run: python3 -m unittest discover -s trusted/tests -p 'test_*.py' -v

  no-hosted-runners-guard:
    # The reusable no-hosted-runners guard: its self-test, and that the copy embedded in the workflow matches its source.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6  # the completion floor: CompleteJob can stall 100 s and retry (trusted timeout-floor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/no_hosted_runners.py --self-test
      - run: python3 scripts/check_no_hosted_runners_embedded.py
