# Reusable DAILY FULL-HISTORY secret sweep for Vagary Labs repositories: the scanners of secret-scan.yml on head's
# whole history (a schedule event selects FULL mode), and an issue when the sweep does not pass.
#
# It is separate from secret-scan.yml because of permissions. Only this report job needs `issues: write`, and a called
# workflow whose job asks for more than the calling job grants fails validation (as quoted from a real run: "The nested
# job '<job>' is requesting '<scope>: <level>', but is only allowed '<scope>: <lower>'"; GitHub's docs: "GITHUB_TOKEN
# permissions can only be the same or more restrictive in nested workflows"). Kept in the PR/push gate, it would fail
# every caller that grants only `contents: read`. The caller grants `issues: write` to the sweep job alone; the
# example caller is in secret-scan.yml's header.
#
# The nested call names secret-scan.yml by its full reference: inside a reusable workflow, `uses: ./...` resolves
# against the CALLER's repository. It follows @main, as the callers do, so the gate and the sweep always run the same
# scanners (the org does not require SHA pins: sha_pinning_required=false, 2026-10-25).
name: Reusable secret-scan sweep

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label, passed to the scanners and used by the report job. Left at the default, the caller's
          SECRET_SCAN_RUNNER variable picks the runner, else ubuntu-latest.
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    uses: vagarylabs/.github/.github/workflows/secret-scan.yml@main
    with:
      runner: ${{ inputs.runner }}
      # Full history with blobs, plus every merge's remerge delta: not measured on the largest caller yet.
      timeout-minutes: 30

  report:
    needs: scan
    if: always() && needs.scan.result != 'success'
    runs-on: ${{ inputs.runner != 'ubuntu-latest' && inputs.runner || vars.SECRET_SCAN_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, or comment on, the sweep-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "secret-scan: scheduled full-history sweep failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          SCAN: ${{ needs.scan.result }}
          GITLEAKS: ${{ needs.scan.outputs.gitleaks == 'true' && 'passed' || 'did not pass' }}
          TRUFFLEHOG: ${{ needs.scan.outputs.trufflehog == 'true' && 'passed' || 'did not pass' }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n' \
            "The scheduled full-history secret sweep did not pass." "" \
            "- run: $RUN_URL" \
            "- event: $EVENT at $SHA" \
            "- sweep result: $SCAN" \
            "- gitleaks: $GITLEAKS" \
            "- trufflehog (verified only): $TRUFFLEHOG" "" \
            "The run log lists each finding by rule or detector, commit, path and line. No value is printed there or here." \
            "A finding the repository's .github/secret-scan-registry.json does not accept says NOT in registry. A registry" \
            "entry whose review_by has passed, or a malformed registry, also fails the sweep: renew the entry with a fresh" \
            "ruling, or remove it.")
          # One open issue per repository: match the title exactly (search is fuzzy and lags), read every open issue.
          num=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
                  --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv' |
                awk -F'\t' -v t="$TITLE" '$2 == t && !n { n = $1 } END { if (n) print n }')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
            echo "commented on #$num"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
