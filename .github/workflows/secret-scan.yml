# Reusable secret-scan gate for Vagary Labs repositories.
#
# Callers add .github/workflows/secret-scan.yml. The PR/push gate is this workflow; the daily full-history sweep is
# secret-scan-sweep.yml, a separate reusable workflow, because only the sweep files an issue and so needs
# `issues: write` (a called workflow whose job asks for more than the caller grants fails validation for EVERY event):
#
#   name: secret-scan
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: '17 4 * * *'
#   permissions:
#     contents: read
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#   jobs:
#     secret-scan:      # required checks: "secret-scan / gitleaks", "secret-scan / trufflehog (verified only)"
#       if: github.event_name != 'schedule'
#       uses: vagarylabs/.github/.github/workflows/secret-scan.yml@main
#     secret-scan-sweep:
#       if: github.event_name == 'schedule'
#       permissions:
#         contents: read
#         issues: write
#       uses: vagarylabs/.github/.github/workflows/secret-scan-sweep.yml@main
#
# Secret detection is done in-house rather than bought: GitHub Secret Protection is not licensed for the private
# repos, by operator ruling (2026-09-29). Both engines are open source and need no key. Pattern taken from
# vagarylabs/vps-ansible secret-scan.yml: the gitleaks ENGINE, not gitleaks/gitleaks-action (which refuses an
# organization repository without a paid licence key); gitleaks pinned to 8.30.1 (8.24.3 silently ignores
# `[[allowlists]]` tables) and trufflehog to 3.97.0, each tarball verified against the release sha256; trufflehog runs
# verified-only, so it fails only on a credential the provider confirms is live.
#
# WHAT IS SCANNED. The checkout is blobless, depth 1, with only .gitleaks.toml and .gitleaksignore on disk;
# actions/secret-scan-scope then fetches exactly what the scan reads (a fetch-depth: 0 checkout cost vagary-platform a
# 182 s p50 for a 1 s scan, and secret-scan was 31% of the light runners' minutes; execnode, 2026-10-25).
#   RANGE (pull_request, merge_group, a fast-forward push), once the range is proven complete:
#     - the added lines of each non-merge commit in base..head;
#     - each two-parent merge's REMERGE DELTA: what the merge as committed adds beyond the automatic merge of its
#       parents (a conflict resolution, an "evil merge"); `git log -p` shows merges with no diff at all;
#     - the NET added lines of merge-base(base, head)..head, so whatever reaches head is read.
#   FULL (schedule and workflow_dispatch via the sweep; a new branch, a force-push, an unprovable range): head's whole
#     history with blobs, plus every two-parent merge's remerge delta.
#   NOT scanned in range mode: binary files (git shows no text diff), removed lines, and history before the range
#   (the daily sweep's). An octopus merge has no remerge delta; in range mode the net change still covers it.
#
# FAIL CLOSED. Measured with these pinned versions: gitleaks exits 0 when its own `git log` fails ("0 commits
# scanned"), and trufflehog exits 0 on a source it cannot read. So each scanner's step also fails when gitleaks logs an
# error line or scans a different number of commits than the selected revisions hold, and when trufflehog logs an
# error, never logs "finished scanning", or scans 0 chunks of a non-empty input. Findings are printed as rule/detector,
# commit, path and line, never the value; a finding on a remerge delta names the MERGE, one on the net change says so.
#
# WHY trufflehog reads a FILE TREE in range mode. `trufflehog git` clones what it scans, and a blobless clone cannot
# serve a clone; `trufflehog stdin` results carry no location at all. So the scope action writes the added lines of each
# selected diff to <commit>/<path>, each at its line number, and `trufflehog filesystem` reads that: a finding maps back
# to commit, path and line. In full mode trufflehog's git source scans a private bare copy of head's complete history.
name: Reusable secret scan

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label. Left at the default, the caller's SECRET_SCAN_RUNNER variable picks the runner
          (vl-c1-capped while GitHub-hosted minutes are budget-blocked), else ubuntu-latest.
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Per-job timeout. The daily full sweep (secret-scan-sweep.yml) passes a longer one.
        required: false
        type: number
        default: 10
    outputs:
      gitleaks:
        description: "'true' when the gitleaks job passed, else empty."
        value: ${{ jobs.gitleaks.outputs.passed }}
      trufflehog:
        description: "'true' when the trufflehog job passed, else empty."
        value: ${{ jobs.trufflehog.outputs.passed }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runner != 'ubuntu-latest' && inputs.runner || vars.SECRET_SCAN_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      passed: ${{ steps.gitleaks.outputs.passed }}
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Blobless and depth 1, with only the scan configuration on disk; the scope step fetches what the scan reads.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /.gitleaks.toml
            /.gitleaksignore
          sparse-checkout-cone-mode: false
      - name: Select and fetch the commits to scan
        id: scope
        uses: vagarylabs/.github/actions/secret-scan-scope@7ea8e6bdd02d5a3975ff5ede6940f83c603968d6
      # Reuse the existing copy-then-hash cache; a cache miss still needs verified downloaded bytes.
      - name: Fetch pinned gitleaks archive
        uses: vagarylabs/.github/actions/fetch-release-asset@3014f2b6ead1a935d75f28e7e2dd173e0fd9b1b0
        timeout-minutes: 5
        with:
          tool: gitleaks
          version: ${{ env.GITLEAKS_VERSION }}
          url: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          sha256: ${{ env.GITLEAKS_SHA256 }}
          dest: ${{ runner.temp }}/gitleaks.tar.gz
          max-time: "90"
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          [ "$(uname -s)-$(uname -m)" = "Linux-x86_64" ] || { echo "::error::gitleaks pin is linux_x64; runner is $(uname -s)-$(uname -m)"; exit 1; }
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version | grep -qx "$GITLEAKS_VERSION"
      - name: gitleaks
        id: gitleaks
        env:
          REVS: ${{ steps.scope.outputs.revs }}
          SCOPE_DIR: ${{ steps.scope.outputs.dir }}
        run: |
          set -euo pipefail
          cfg=()
          [ -f .gitleaks.toml ] && cfg=(--config .gitleaks.toml)
          # gitleaks runs `git log -p -U0 <log-opts>`: the same revisions, so the same commit count, are checked below.
          expected=$(python3 "$SCOPE_DIR/diffscan.py" count "$REVS")
          echo "scanning: $REVS ($expected commit(s) with text changes)"
          report="$RUNNER_TEMP/gitleaks.json"
          log="$RUNNER_TEMP/gitleaks.log"
          rc=0
          "$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --exit-code 1 "${cfg[@]}" \
            --report-format json --report-path "$report" --log-opts="$REVS" . > "$log" 2>&1 || rc=$?
          sed 's/\x1b\[[0-9;]*m//g' "$log"
          python3 "$SCOPE_DIR/diffscan.py" gitleaks "$report" "$log" "$rc" "$expected"
          echo "passed=true" >> "$GITHUB_OUTPUT"

  trufflehog:
    name: trufflehog (verified only)
    runs-on: ${{ inputs.runner != 'ubuntu-latest' && inputs.runner || vars.SECRET_SCAN_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      passed: ${{ steps.trufflehog.outputs.passed }}
    env:
      TRUFFLEHOG_VERSION: "3.97.0"
      TRUFFLEHOG_SHA256: "62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4"
    steps:
      # Blobless and depth 1, with only the scan configuration on disk; the scope step fetches what the scan reads.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /.gitleaks.toml
            /.gitleaksignore
          sparse-checkout-cone-mode: false
      - name: Select and fetch the commits to scan; write their added lines as files
        id: scope
        uses: vagarylabs/.github/actions/secret-scan-scope@7ea8e6bdd02d5a3975ff5ede6940f83c603968d6
        with:
          tree: ${{ runner.temp }}/secret-scan-tree
      # A measured slow CDN must not force every scan to download this archive again.
      - name: Fetch pinned trufflehog archive
        uses: vagarylabs/.github/actions/fetch-release-asset@3014f2b6ead1a935d75f28e7e2dd173e0fd9b1b0
        timeout-minutes: 5
        with:
          tool: trufflehog
          version: ${{ env.TRUFFLEHOG_VERSION }}
          url: https://github.com/trufflesecurity/trufflehog/releases/download/v${{ env.TRUFFLEHOG_VERSION }}/trufflehog_${{ env.TRUFFLEHOG_VERSION }}_linux_amd64.tar.gz
          sha256: ${{ env.TRUFFLEHOG_SHA256 }}
          dest: ${{ runner.temp }}/trufflehog.tar.gz
          max-time: "90"
      - name: Install trufflehog (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/trufflehog.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" trufflehog
          "$RUNNER_TEMP/bin/trufflehog" --version
      - name: trufflehog
        id: trufflehog
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
          TREE: ${{ steps.scope.outputs.tree }}
          TREE_FILES: ${{ steps.scope.outputs.tree-files }}
          SCOPE_DIR: ${{ steps.scope.outputs.dir }}
        run: |
          set -euo pipefail
          scan() { # scan <min chunks> <name> <trufflehog source args...>
            local min=$1 name=$2 rc=0 log="$RUNNER_TEMP/trufflehog-$2.log"
            shift 2
            echo "trufflehog ($name): $*"
            "$RUNNER_TEMP/bin/trufflehog" "$@" --only-verified --json --no-update 2> "$log" |
              python3 "$SCOPE_DIR/diffscan.py" trufflehog "$TREE" || rc=$?
            python3 "$SCOPE_DIR/diffscan.py" trufflehog-log "$log" "$min" || rc=1
            return "$rc"
          }
          status=0
          if [ "$MODE" = full ]; then
            # The git source clones what it scans; a PR checkout also holds the merge ref, whose blobs were never
            # fetched. So scan a private bare repository holding exactly head's (complete) history.
            bare="$RUNNER_TEMP/secret-scan-history.git"
            git init --quiet --bare "$bare"
            git push --quiet "$bare" "$HEAD_SHA:refs/heads/secret-scan-head"
            scan 1 history git "file://$bare" --bare --branch secret-scan-head || status=1
          fi
          # Range: the added lines of every selected diff. Full: the merges' remerge deltas, which history scans miss.
          scan "$([ "${TREE_FILES:-0}" -gt 0 ] && echo 1 || echo 0)" diffs filesystem "$TREE" || status=1
          [ "$status" = 0 ]
          echo "passed=true" >> "$GITHUB_OUTPUT"
