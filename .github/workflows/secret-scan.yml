# Reusable secret-scan gate for Vagary Labs repositories.
# GENERATED from trusted/templates/secret-scan.yml.in by `python3 trusted/render.py`; edit the template.
#
# Callers add .github/workflows/secret-scan.yml:
#
#   name: secret-scan
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "17 21 * * *"   # once a day: the full-history scan
#   permissions:
#     contents: read
#   jobs:
#     secret-scan:
#       uses: vagarylabs/.github/.github/workflows/secret-scan.yml@main
#
# Repositories covered by the org ruleset's trusted-secret-scan (pinned, PR-proof) get the same scanners
# from there; this reusable workflow stays for every other caller and is retired per repository once the
# trusted checks are active there.
#
# Secret detection is done in-house rather than bought: GitHub Secret Protection is not licensed
# for the private repos, by operator ruling (2026-09-29). Both engines are open source and need no key.
#
# Pattern taken from vagarylabs/vps-ansible secret-scan.yml:
#   * the gitleaks ENGINE, not gitleaks/gitleaks-action, which refuses to run for an organization
#     repository without a paid licence key;
#   * gitleaks pinned to 8.30.1 (8.24.3 silently ignores `[[allowlists]]` tables), tarball verified
#     against the release sha256;
#   * the scan covers the commits this event introduces: a PR's merge-base..head, a push's before..after.
#     A new branch, a force-push, a `before` that cannot be read, a schedule or a workflow_dispatch scans the
#     FULL history of the commit, never just the pushed commit. A PR range that cannot be resolved, or is
#     empty, is UNAVAILABLE and fails;
#   * IO: gitleaks reads a blob-less, sparse checkout and fetches only the blobs the range reads. trufflehog
#     always clones its file:// source, so it gets a separate repository fetched to depth commits+2 (checked
#     complete, deepened or failed), not the full history twice;
#   * positive control: on a non-empty range each scanner must REPORT it read something (gitleaks "N commits
#     scanned" with N > 0; trufflehog "finished scanning", and chunks > 0 when the range adds lines);
#   * trufflehog keeps verified AND unverifiable results: a verified one is a live credential (FINDINGS),
#     and one whose verification errored (provider unreachable) is UNAVAILABLE, not a silent pass.
# Each job ends in exactly one state (trusted/scanstate.py, ledger C9) in the job summary and an annotation.
name: Reusable secret scan

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label. Left at the default, the caller's SECRET_SCAN_RUNNER repository variable picks the
          runner (the mini-PC bridge's vl-light label for the repositories that set it), else ubuntu-latest.
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runner != 'ubuntu-latest' && inputs.runner || vars.SECRET_SCAN_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Every step below reports into one recorder; the final gate step merges what was recorded, and a check
      # it expects but nobody recorded (a failed or skipped step) is UNAVAILABLE, never a pass.
      - name: Install the scan-state recorder (inline copy of trusted/scanstate.py)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/trusted"
          mkdir -p "$d" "$RUNNER_TEMP/scan-records"
          cat > "$d/scanstate.py" <<'TRUSTED_SCANSTATE_PY'
          #!/usr/bin/env python3
          """Scan result states for the Vagary Labs scan workflows (ledger C9). Stdlib only, Python >= 3.8.

          Every scanner job ends in exactly ONE state:
            PASSED                the scanner ran to completion over the full declared scope; nothing at threshold.
            FINDINGS              it ran and found something at threshold. Blocks.
            UNAVAILABLE           it did not run to completion, or the scope was not covered (tool fetch failed,
                                  empty or unresolvable range, verifier unreachable, scanner error). Blocks, like FINDINGS.
            NOT_APPLICABLE        a recorded, printed predicate says this change has nothing for the scanner.
            AUTHORIZED_EXCEPTION  a finding or unavailability is waived by an unexpired, approved register entry.
          A gate passes only on PASSED, NOT_APPLICABLE or AUTHORIZED_EXCEPTION. A scanner listed in REPORT_ONLY
          records its state the same way but never fails the job.

          This file is the single source. Workflows carry a byte-identical inline copy (a heredoc rendered by
          trusted/render.py), because a ruleset workflow must not read code from the repository it judges.

          Each step appends one record (one check) to <records>/<scanner>.jsonl; `gate` merges them. A check that
          `gate --expect` names but nobody recorded is UNAVAILABLE: a skipped or failed step can never read as a pass.

          Nothing here prints a secret: findings are reported as rule, path, line and commit only.
          """
          import argparse
          import collections
          import datetime
          import hashlib
          import json
          import os
          import re
          import sys

          STATES = ("PASSED", "FINDINGS", "UNAVAILABLE", "NOT_APPLICABLE", "AUTHORIZED_EXCEPTION")
          PASSING = ("PASSED", "NOT_APPLICABLE", "AUTHORIZED_EXCEPTION")
          # Lower is worse. A job's state is the worst of its checks.
          RANK = {"FINDINGS": 0, "UNAVAILABLE": 1, "AUTHORIZED_EXCEPTION": 2, "PASSED": 3, "NOT_APPLICABLE": 4}

          # REPORT-ONLY scanners record a state but never fail the job. Flip one to False (and bump the ruleset pin)
          # only when the criterion in trusted/README.md ("Report-only to required") is met for it.
          REPORT_ONLY = {"gitleaks": False, "trufflehog": False, "semgrep": True, "sca": True}

          GITLEAKS_FINDINGS_RC = 42   # passed as --exit-code, so a gitleaks ERROR (exit 1) cannot read as findings
          SEMGREP_THRESHOLD = ("ERROR", "WARNING")
          MAX_LISTED = 50
          EXPIRY_MAX_DAYS = 90
          SCHEMA = "vagarylabs.scan-result/v1"


          def die(msg):
              raise SystemExit("scanstate: " + msg)


          # --- records ---------------------------------------------------------------------------------

          def records_dir(arg=None):
              d = arg or os.environ.get("SCAN_RECORDS") or os.path.join(os.environ.get("RUNNER_TEMP") or ".", "scan-records")
              os.makedirs(d, exist_ok=True)
              return d


          def make_check(check, state, reason, counts=None, items=None, tool=None, scope=None):
              if state not in STATES:
                  die("unknown state %r" % state)
              return {"check": check, "state": state, "reason": reason, "counts": counts or {},
                      "items": (items or [])[:MAX_LISTED], "items_total": len(items or []),
                      "tool": tool or {}, "scope": scope or ""}


          def append(rdir, scanner, rec):
              with open(os.path.join(rdir, scanner + ".jsonl"), "a", encoding="utf-8") as fh:
                  fh.write(json.dumps(rec, sort_keys=True) + "\n")


          def load(rdir, scanner):
              path = os.path.join(rdir, scanner + ".jsonl")
              out = []
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as fh:
                      for line in fh:
                          if line.strip():
                              out.append(json.loads(line))
              return out


          def merge(records, expect):
              """(state, reason, checks). Missing expected checks are UNAVAILABLE; no record at all is UNAVAILABLE."""
              checks = list(records)
              seen = {r["check"] for r in checks}
              for name in expect:
                  if name not in seen:
                      checks.append(make_check(name, "UNAVAILABLE",
                                               "no result recorded for check '%s': a step before it failed or was skipped" % name))
              if not checks:
                  checks.append(make_check("scan", "UNAVAILABLE", "no result recorded: the scanner never reported"))
              worst = min(checks, key=lambda r: RANK[r["state"]])
              return worst["state"], worst["reason"], checks


          def gate_exit(scanner, state, report_only=None):
              ro = REPORT_ONLY.get(scanner, False) if report_only is None else report_only
              if ro:
                  return 0
              return 0 if state in PASSING else 1


          # --- scanner-reported coverage (positive control) ---------------------------------------------
          # The range's commit count says what SHOULD be scanned; these read what the scanner SAYS it scanned, so a scanner
          # that resolved nothing (a missing object, a range it could not walk) cannot pass on a non-empty range.

          ANSI = re.compile(r"\x1b\[[0-9;]*m")


          def gitleaks_commits_scanned(log_text):
              """N from gitleaks' 'N commits scanned.' log line; None when absent."""
              if log_text is None:
                  return None
              m = re.findall(r"\b(\d+) commits? scanned", ANSI.sub("", log_text))
              return int(m[-1]) if m else None


          def trufflehog_finished(log_text):
              """(chunks, bytes) from trufflehog's JSON 'finished scanning' log line; None when absent."""
              for line in (log_text or "").splitlines():
                  try:
                      r = json.loads(line)
                  except ValueError:
                      continue
                  if isinstance(r, dict) and r.get("msg") == "finished scanning":
                      try:
                          return int(r.get("chunks")), int(r.get("bytes"))
                      except (TypeError, ValueError):
                          return None
              return None


          # --- gitleaks --------------------------------------------------------------------------------

          def classify_gitleaks(rc, report_text, commits, scope, tool=None, log_text=None):
              if commits is not None and commits <= 0:
                  return make_check("scan", "UNAVAILABLE", "empty scan range %s: nothing was scanned" % scope, tool=tool, scope=scope)
              if rc not in (0, GITLEAKS_FINDINGS_RC):
                  return make_check("scan", "UNAVAILABLE", "gitleaks exited %d (an error, not a finding)" % rc, tool=tool, scope=scope)
              if log_text is not None:
                  n = gitleaks_commits_scanned(log_text)
                  if n is None:
                      return make_check("scan", "UNAVAILABLE", "gitleaks did not report how many commits it scanned in %s" % scope,
                                        tool=tool, scope=scope)
                  if n <= 0:
                      return make_check("scan", "UNAVAILABLE", "gitleaks reported %d commits scanned over a non-empty range %s "
                                        "(%s commit(s)): nothing was read" % (n, scope, commits), tool=tool, scope=scope)
              try:
                  rows = json.loads(report_text) if report_text is not None else None
              except ValueError:
                  rows = None
              if not isinstance(rows, list):
                  return make_check("scan", "UNAVAILABLE", "gitleaks report missing or unreadable; completeness not proven",
                                    tool=tool, scope=scope)
              items = [{"rule": r.get("RuleID"), "path": r.get("File"), "line": r.get("StartLine"),
                        "commit": (r.get("Commit") or "")[:12]} for r in rows if isinstance(r, dict)]
              if rc == GITLEAKS_FINDINGS_RC or items:
                  if not items:
                      return make_check("scan", "UNAVAILABLE", "gitleaks signalled findings but its report lists none",
                                        tool=tool, scope=scope)
                  return make_check("scan", "FINDINGS", "%d gitleaks finding(s) in %s" % (len(items), scope),
                                    {"findings": len(items)}, items, tool, scope)
              return make_check("scan", "PASSED", "gitleaks scanned %s: no findings" % scope,
                                {"findings": 0, "commits": commits if commits is not None else -1}, tool=tool, scope=scope)


          # --- trufflehog ------------------------------------------------------------------------------

          def _cause(err):
              e = (err or "").lower()
              for key, words in (("connection-refused", ("connection refused",)),
                                 ("timeout", ("timeout", "deadline exceeded", "timed out")),
                                 ("dns", ("no such host", "lookup ", "server misbehaving")),
                                 ("tls", ("tls", "x509", "certificate")),
                                 ("proxy", ("proxyconnect", "proxy")),
                                 ("http-status", ("status code", "unexpected http", "unexpected response", "429", "5xx"))):
                  if any(w in e for w in words):
                      return key
              return "other"


          def _thog_location(r):
              meta = ((r.get("SourceMetadata") or {}).get("Data") or {})
              git = meta.get("Git") or meta.get("Filesystem") or {}
              return git.get("file"), git.get("line"), (git.get("commit") or "")[:12]


          def classify_trufflehog(rc, results_text, commits, scope, tool=None, log_text=None, added=None):
              """Input is trufflehog --json --results=verified,unknown output. A verified result is a live credential
              (FINDINGS). An unknown result means verification was attempted and errored, e.g. the provider was
              unreachable: that candidate was NOT cleared, so the scan is UNAVAILABLE, never PASSED."""
              if commits is not None and commits <= 0:
                  return make_check("scan", "UNAVAILABLE", "empty scan range %s: nothing was scanned" % scope, tool=tool, scope=scope)
              if rc != 0:
                  return make_check("scan", "UNAVAILABLE", "trufflehog exited %d (scan error)" % rc, tool=tool, scope=scope)
              if log_text is not None:
                  fin = trufflehog_finished(log_text)
                  if fin is None:
                      return make_check("scan", "UNAVAILABLE", "trufflehog did not log 'finished scanning' for %s" % scope,
                                        tool=tool, scope=scope)
                  if added and fin[0] <= 0:
                      return make_check("scan", "UNAVAILABLE", "trufflehog scanned 0 chunks over %s, which adds %d line(s): "
                                        "nothing was read" % (scope, added), tool=tool, scope=scope)
              if results_text is None:
                  return make_check("scan", "UNAVAILABLE", "trufflehog output missing", tool=tool, scope=scope)
              verified, unknown = [], []
              for n, line in enumerate(results_text.splitlines(), 1):
                  if not line.strip():
                      continue
                  try:
                      r = json.loads(line)
                  except ValueError:
                      return make_check("scan", "UNAVAILABLE", "trufflehog output line %d is not JSON" % n, tool=tool, scope=scope)
                  if not isinstance(r, dict):
                      return make_check("scan", "UNAVAILABLE", "trufflehog output line %d is not an object" % n, tool=tool, scope=scope)
                  path, ln, commit = _thog_location(r)
                  item = {"rule": r.get("DetectorName"), "path": path, "line": ln, "commit": commit}
                  if r.get("Verified") is True:
                      verified.append(item)
                  elif r.get("VerificationError"):
                      item["cause"] = _cause(r.get("VerificationError"))
                      unknown.append(item)
              counts = {"verified": len(verified), "verification_errors": len(unknown)}
              if verified:
                  return make_check("scan", "FINDINGS", "%d verified live credential(s) in %s" % (len(verified), scope),
                                    counts, verified + unknown, tool, scope)
              if unknown:
                  causes = sorted({i["cause"] for i in unknown})
                  dets = sorted({str(i["rule"]) for i in unknown})
                  return make_check("scan", "UNAVAILABLE",
                                    "verification could not complete for %d candidate(s) (detectors %s; cause %s); "
                                    "they are not cleared" % (len(unknown), ", ".join(dets), ", ".join(causes)),
                                    counts, unknown, tool, scope)
              return make_check("scan", "PASSED", "trufflehog scanned %s: no verified or unverifiable candidate" % scope,
                                counts, tool=tool, scope=scope)


          # --- semgrep ---------------------------------------------------------------------------------

          def _semgrep_keys(doc, root):
              keys = collections.Counter()
              items = []
              for r in doc.get("results") or []:
                  sev = ((r.get("extra") or {}).get("severity") or "").upper()
                  if sev not in SEMGREP_THRESHOLD:
                      continue
                  path = r.get("path") or ""
                  start = (r.get("start") or {}).get("line") or 0
                  end = (r.get("end") or {}).get("line") or start
                  text = ""
                  try:
                      with open(os.path.join(root, path), encoding="utf-8", errors="replace") as fh:
                          text = "".join(fh.readlines()[max(start - 1, 0):end])
                  except OSError:
                      pass
                  digest = hashlib.sha256(re.sub(r"\s+", " ", text).strip().encode()).hexdigest()
                  key = (r.get("check_id"), path, digest)
                  keys[key] += 1
                  items.append((key, {"rule": r.get("check_id"), "path": path, "line": start, "severity": sev}))
              return keys, items


          def classify_semgrep(rc, head_text, base_text, rules, head_root, base_root, scope, tool=None):
              """Findings at or above SEMGREP_THRESHOLD in the PR's changed files that the same files at the
              merge-base do not already carry (matched by rule, path and normalised matched text)."""
              if rules <= 0:
                  return make_check("scan", "UNAVAILABLE", "no semgrep rules loaded", tool=tool, scope=scope)
              if rc != 0:
                  return make_check("scan", "UNAVAILABLE", "semgrep exited %d" % rc, tool=tool, scope=scope)
              try:
                  head = json.loads(head_text)
                  base = json.loads(base_text) if base_text else {"results": [], "errors": []}
              except (TypeError, ValueError):
                  return make_check("scan", "UNAVAILABLE", "semgrep JSON missing or unreadable", tool=tool, scope=scope)
              errors = (head.get("errors") or []) + (base.get("errors") or [])
              if errors:
                  kinds = collections.Counter(str(e.get("type") if not isinstance(e.get("type"), list) else e["type"][0])
                                              for e in errors)
                  return make_check("scan", "UNAVAILABLE", "semgrep reported %d error(s): %s; the scope is not fully covered"
                                    % (len(errors), ", ".join("%s=%d" % kv for kv in sorted(kinds.items()))),
                                    {"errors": len(errors)}, tool=tool, scope=scope)
              hk, hitems = _semgrep_keys(head, head_root)
              bk, _ = _semgrep_keys(base, base_root)
              new = hk - bk
              items, budget = [], collections.Counter(new)
              for key, item in hitems:
                  if budget[key] > 0:
                      budget[key] -= 1
                      items.append(item)
              counts = {"rules": rules, "head_findings": sum(hk.values()), "base_findings": sum(bk.values()),
                        "new_findings": len(items)}
              if items:
                  return make_check("scan", "FINDINGS", "%d new semgrep finding(s) at %s in %s"
                                    % (len(items), "/".join(SEMGREP_THRESHOLD), scope), counts, items, tool, scope)
              return make_check("scan", "PASSED", "semgrep: no new finding at %s in %s" % ("/".join(SEMGREP_THRESHOLD), scope),
                                counts, tool=tool, scope=scope)


          # --- SCA (osv-scanner) -----------------------------------------------------------------------

          OSV_OK = (0, 1)        # 0 clean, 1 vulnerabilities found
          OSV_NO_PACKAGES = 128  # treated as an empty set: the lockfile exists and lists nothing
          # 129 API failed, 130 invalid config, 127 any other error: all UNAVAILABLE (osv-scanner v2.7.0 run.go).


          def _rel(src, root):
              for r in {root, os.path.realpath(root)} if root else ():
                  r = r.rstrip("/") + "/"
                  for s in (src, "/" + src.lstrip("/")):
                      if s.startswith(r):
                          return s[len(r):]
              return src


          OSV_ERROR_LINE = re.compile(r"^\s*(error|fatal)\b", re.I | re.M)


          def _osv_keys(doc, root):
              keys = {}
              for res in (doc or {}).get("results") or []:
                  src = _rel((res.get("source") or {}).get("path") or "", root)
                  for p in res.get("packages") or []:
                      pkg = p.get("package") or {}
                      sev = {}
                      for g in p.get("groups") or []:
                          for vid in g.get("ids") or []:
                              sev[vid] = g.get("max_severity") or ""
                      for v in p.get("vulnerabilities") or []:
                          key = (src, pkg.get("ecosystem"), pkg.get("name"), v.get("id"))
                          keys[key] = {"rule": v.get("id"), "path": src, "package": "%s@%s" % (pkg.get("name"), pkg.get("version")),
                                       "ecosystem": pkg.get("ecosystem"), "severity": sev.get(v.get("id"), "")}
              return keys


          def classify_sca(rc_head, head_text, rc_base, base_text, head_root, base_root, scope, tool=None,
                           head_err=None, base_err=None):
              """Advisories on the changed lockfiles at head that the same lockfiles at the merge-base do not carry.
              osv-scanner can log an extraction error and still exit 1 on the packages it did read: that is a partial
              scope, so an error line on stderr is UNAVAILABLE as well."""
              for side, rc, err in (("head", rc_head, head_err), ("base", rc_base, base_err)):
                  if rc is None:
                      continue
                  if rc not in OSV_OK and rc != OSV_NO_PACKAGES:
                      why = {124: "timed out", 129: "advisory API unreachable", 130: "invalid config"}.get(rc, "scanner error")
                      return make_check("scan", "UNAVAILABLE", "osv-scanner (%s) exited %d: %s" % (side, rc, why), tool=tool, scope=scope)
                  if err and OSV_ERROR_LINE.search(err):
                      n = len(OSV_ERROR_LINE.findall(err))
                      return make_check("scan", "UNAVAILABLE", "osv-scanner (%s) logged %d error line(s) (e.g. a lockfile it could "
                                        "not extract or resolve): the scope is only partly covered" % (side, n), tool=tool, scope=scope)
              try:
                  head = json.loads(head_text) if rc_head in OSV_OK else {"results": []}
                  base = json.loads(base_text) if rc_base in OSV_OK else {"results": []}
              except (TypeError, ValueError):
                  return make_check("scan", "UNAVAILABLE", "osv-scanner JSON missing or unreadable", tool=tool, scope=scope)
              hk, bk = _osv_keys(head, head_root), _osv_keys(base, base_root)
              new = [hk[k] for k in sorted(set(hk) - set(bk), key=lambda k: tuple(str(x) for x in k))]
              counts = {"head_vulns": len(hk), "base_vulns": len(bk), "new_vulns": len(new)}
              if new:
                  return make_check("scan", "FINDINGS", "%d advisory(ies) introduced by the changed lockfiles in %s"
                                    % (len(new), scope), counts, new, tool, scope)
              return make_check("scan", "PASSED", "no advisory introduced by the changed lockfiles in %s" % scope,
                                counts, tool=tool, scope=scope)


          LOCKFILES = ("package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock",
                       "requirements.txt", "poetry.lock", "Pipfile.lock", "pdm.lock", "uv.lock", "go.mod",
                       "Cargo.lock", "Gemfile.lock", "composer.lock", "pom.xml", "gradle.lockfile", "mix.lock",
                       "pubspec.lock", "renv.lock", "packages.lock.json", "conan.lock")


          def is_lockfile(path):
              base = path.rsplit("/", 1)[-1]
              return base in LOCKFILES or bool(re.match(r"^requirements[-_.\w]*\.txt$", base))


          # --- trivy (for repo image workflows that adopt this file) ----------------------------------------

          TRIVY_FINDINGS_RC = 42  # the caller passes --exit-code 42: trivy also exits 1 on its own errors


          def classify_trivy(rc, image, tool=None):
              if rc == 0:
                  return make_check("scan", "PASSED", "trivy: no finding at threshold in %s" % image, tool=tool, scope=image)
              if rc == TRIVY_FINDINGS_RC:
                  return make_check("scan", "FINDINGS", "trivy reported findings at threshold in %s" % image, tool=tool, scope=image)
              return make_check("scan", "UNAVAILABLE", "trivy exited %d: an error (DB download, timeout or scan failure), "
                                "not a finding" % rc, tool=tool, scope=image)


          # --- allowlist / exception entries -----------------------------------------------------------

          TABLE = re.compile(r"^\s*\[\[?\s*([A-Za-z0-9_.\-]+)\s*\]\]?\s*(#.*)?$")
          ALLOWLIST_TABLES = ("allowlist", "allowlists", "rules.allowlist", "rules.allowlists")
          KEY = re.compile(r"^\s*(approver|expires)\s*=\s*(.+?)\s*(#.*)?$")
          IGNORE_META = re.compile(r'^#\s*exception:\s*approver\s*=\s*"([^"]+)"\s+expires\s*=\s*(\d{4}-\d{2}-\d{2})\s*$')
          DATE = re.compile(r'^"?(\d{4}-\d{2}-\d{2})"?$')


          def _check_entry(label, approver, expires, today, problems):
              if not approver:
                  problems.append("%s: no approver" % label)
              if not expires:
                  problems.append("%s: no expires date" % label)
                  return
              try:
                  exp = datetime.date.fromisoformat(expires)
              except ValueError:
                  problems.append("%s: expires %r is not a YYYY-MM-DD date" % (label, expires))
                  return
              if exp < today:
                  problems.append("%s: EXPIRED on %s (UTC); renew with a fresh approval or remove the entry" % (label, exp))
              elif (exp - today).days > EXPIRY_MAX_DAYS:
                  problems.append("%s: expires %s is more than %d days after %s (UTC)" % (label, exp, EXPIRY_MAX_DAYS, today))


          def check_gitleaks_toml(text, today):
              """Every [allowlist]/[[allowlists]]/[rules.allowlist]/[[rules.allowlists]] table must carry
              approver = "<who>" and expires = YYYY-MM-DD (UTC, at most EXPIRY_MAX_DAYS ahead). -> (entries, problems)."""
              problems, entries, cur = [], 0, None

              def close(c):
                  if c is not None:
                      _check_entry(".gitleaks.toml:%d [%s]" % (c["line"], c["name"]), c.get("approver"), c.get("expires"),
                                   today, problems)

              for n, line in enumerate((text or "").splitlines(), 1):
                  m = TABLE.match(line)
                  if m:
                      close(cur)
                      cur = None
                      if m.group(1) in ALLOWLIST_TABLES:
                          entries += 1
                          cur = {"line": n, "name": m.group(1)}
                      continue
                  if cur is None:
                      continue
                  k = KEY.match(line)
                  if k:
                      val = k.group(2)
                      if k.group(1) == "approver":
                          sm = re.match(r'^"([^"]*)"$', val) or re.match(r"^'([^']*)'$", val)
                          cur["approver"] = sm.group(1).strip() if sm else ""
                      else:
                          dm = DATE.match(val)
                          cur["expires"] = dm.group(1) if dm else val
              close(cur)
              return entries, problems


          def check_gitleaksignore(text, today):
              """Each fingerprint line must sit under a `# exception: approver="<who>" expires=YYYY-MM-DD` line in the
              same paragraph (no blank line between). -> (entries, problems)."""
              problems, entries, meta = [], 0, None
              for n, raw in enumerate((text or "").splitlines(), 1):
                  line = raw.strip()
                  if not line:
                      meta = None
                      continue
                  if line.startswith("#"):
                      m = IGNORE_META.match(line)
                      if m:
                          meta = (m.group(1).strip(), m.group(2))
                      elif line.lower().startswith("# exception:"):
                          problems.append(".gitleaksignore:%d: malformed exception line" % n)
                      continue
                  entries += 1
                  label = ".gitleaksignore:%d" % n
                  if meta is None:
                      problems.append("%s: fingerprint has no `# exception: approver=... expires=...` line above it" % label)
                  else:
                      _check_entry(label, meta[0], meta[1], today, problems)
              return entries, problems


          def classify_exceptions(toml_text, ignore_text, today):
              te, tp = check_gitleaks_toml(toml_text, today)
              ie, ip = check_gitleaksignore(ignore_text, today)
              problems = tp + ip
              counts = {"allowlist_tables": te, "ignore_fingerprints": ie, "invalid": len(problems)}
              items = [{"rule": "exception-register", "path": p.split(":", 1)[0], "line": None, "detail": p} for p in problems]
              if problems:
                  return make_check("exceptions", "FINDINGS", "%d allowlist entr(y/ies) invalid or expired: %s"
                                    % (len(problems), "; ".join(problems[:5])), counts, items)
              return make_check("exceptions", "PASSED", "%d allowlist table(s) and %d ignore fingerprint(s), all approved and "
                                "unexpired as of %s (UTC)" % (te, ie, today), counts)


          # --- output ----------------------------------------------------------------------------------

          def result_doc(scanner, state, reason, checks, report_only):
              env = os.environ.get
              return {
                  "schema": SCHEMA, "scanner": scanner, "state": state, "reason": reason,
                  "mode": "report-only" if report_only else "blocking",
                  "gate": "report-only" if report_only else ("pass" if state in PASSING else "fail"),
                  "repository": env("GITHUB_REPOSITORY"), "event": env("GITHUB_EVENT_NAME"),
                  "run_id": env("GITHUB_RUN_ID"), "run_attempt": env("GITHUB_RUN_ATTEMPT"), "job": env("GITHUB_JOB"),
                  "base": env("SCAN_BASE"), "head": env("SCAN_HEAD"), "merge_base": env("SCAN_MERGE_BASE"),
                  "generated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "generated_at_basis": "runner clock, UTC",
                  "checks": checks,
              }


          def summary_lines(doc):
              lines = ["### %s: **%s** (%s)" % (doc["scanner"], doc["state"], doc["mode"]), "",
                       "| check | state | scope | reason |", "|---|---|---|---|"]
              for c in doc["checks"]:
                  lines.append("| %s | %s | `%s` | %s |" % (c["check"], c["state"], c.get("scope") or "",
                                                             c["reason"].replace("|", "/")))
              listed = [i for c in doc["checks"] for i in c.get("items") or []]
              if listed:
                  lines += ["", "| rule | path | line | detail |", "|---|---|---|---|"]
                  for i in listed[:MAX_LISTED]:
                      lines.append("| %s | `%s` | %s | %s |" % (i.get("rule"), i.get("path"), i.get("line"),
                                                                i.get("detail") or i.get("cause") or i.get("severity") or ""))
              return lines


          def emit(scanner, doc, out_dir):
              path = os.path.join(out_dir, "scan-result-%s.json" % scanner)
              with open(path, "w", encoding="utf-8") as fh:
                  json.dump(doc, fh, indent=2, sort_keys=True)
                  fh.write("\n")
              text = "\n".join(summary_lines(doc)) + "\n"
              sp = os.environ.get("GITHUB_STEP_SUMMARY")
              if sp:
                  with open(sp, "a", encoding="utf-8") as fh:
                      fh.write(text)
              gp = os.environ.get("GITHUB_OUTPUT")
              if gp:
                  with open(gp, "a", encoding="utf-8") as fh:
                      fh.write("state=%s\n" % doc["state"])
              sys.stdout.write(text)
              level = "notice" if doc["state"] in PASSING or doc["mode"] == "report-only" else "error"
              print("::%s title=%s %s (%s)::%s" % (level, scanner, doc["state"], doc["mode"], doc["reason"].replace("\n", " ")))
              return path


          # --- CLI -------------------------------------------------------------------------------------

          def _read(path):
              if not path:
                  return None
              try:
                  with open(path, encoding="utf-8", errors="replace") as fh:
                      return fh.read()
              except OSError:
                  return None


          def _tool(a):
              return {k: v for k, v in (("name", getattr(a, "tool_name", None)), ("version", a.tool_version),
                                        ("sha256", a.tool_sha256)) if v}


          def _int(v):
              return None if v in (None, "") else int(v)


          def main(argv=None):
              ap = argparse.ArgumentParser(prog="scanstate")
              ap.add_argument("--records", default=None)
              sub = ap.add_subparsers(dest="cmd", required=True)

              def common(p, tool=True):
                  p.add_argument("--scope", default="")
                  if tool:
                      p.add_argument("--tool-name")
                      p.add_argument("--tool-version")
                      p.add_argument("--tool-sha256")

              p = sub.add_parser("record")
              p.add_argument("--scanner", required=True)
              p.add_argument("--check", required=True)
              p.add_argument("--state", required=True, choices=STATES)
              p.add_argument("--reason", required=True)
              common(p, tool=False)

              p = sub.add_parser("gitleaks")
              p.add_argument("--rc", type=int, required=True)
              p.add_argument("--report")
              p.add_argument("--commits", type=int)
              p.add_argument("--log", help="gitleaks stderr; asserts 'N commits scanned' with N > 0")
              common(p)

              p = sub.add_parser("trufflehog")
              p.add_argument("--rc", type=int, required=True)
              p.add_argument("--results")
              p.add_argument("--commits", type=int)
              p.add_argument("--log", help="trufflehog stderr (--json logs); asserts it finished and read a chunk")
              p.add_argument("--added", type=int, help="lines the range adds; >0 requires chunks > 0")
              common(p)

              p = sub.add_parser("semgrep")
              p.add_argument("--rc", type=int, required=True)
              p.add_argument("--head", required=True)
              p.add_argument("--base")
              p.add_argument("--head-root", required=True)
              p.add_argument("--base-root", default="")
              p.add_argument("--rules", type=int, required=True)
              common(p)

              p = sub.add_parser("sca")
              p.add_argument("--rc-head", default="")
              p.add_argument("--head")
              p.add_argument("--rc-base", default="")
              p.add_argument("--base")
              p.add_argument("--head-root", default="")
              p.add_argument("--base-root", default="")
              p.add_argument("--head-err")
              p.add_argument("--base-err")
              common(p)

              p = sub.add_parser("trivy")
              p.add_argument("--rc", type=int, required=True)
              p.add_argument("--image", required=True)
              common(p)

              p = sub.add_parser("exceptions")
              p.add_argument("--gitleaks-toml")
              p.add_argument("--gitleaksignore")
              p.add_argument("--today", help="YYYY-MM-DD, UTC; default: today's UTC date")

              p = sub.add_parser("is-lockfile")
              p.add_argument("paths", nargs="*")

              p = sub.add_parser("gate")
              p.add_argument("--scanner", required=True)
              p.add_argument("--expect", default="", help="comma-separated checks that must have been recorded")
              p.add_argument("--out", default=None, help="directory for scan-result-<scanner>.json")

              a = ap.parse_args(argv)
              if a.cmd == "is-lockfile":
                  for path in a.paths or sys.stdin.read().split("\n"):
                      if path and is_lockfile(path):
                          print(path)
                  return 0

              rdir = records_dir(a.records)
              if a.cmd == "gate":
                  state, reason, checks = merge(load(rdir, a.scanner), [x for x in a.expect.split(",") if x])
                  ro = REPORT_ONLY.get(a.scanner, False)
                  emit(a.scanner, result_doc(a.scanner, state, reason, checks, ro), a.out or rdir)
                  return gate_exit(a.scanner, state)

              if a.cmd == "record":
                  rec, scanner = make_check(a.check, a.state, a.reason, scope=a.scope), a.scanner
              elif a.cmd == "gitleaks":
                  rec, scanner = classify_gitleaks(a.rc, _read(a.report), a.commits, a.scope, _tool(a),
                                                     log_text=(_read(a.log) or "") if a.log else None), "gitleaks"
              elif a.cmd == "trufflehog":
                  rec, scanner = classify_trufflehog(a.rc, _read(a.results), a.commits, a.scope, _tool(a),
                                                       log_text=(_read(a.log) or "") if a.log else None, added=a.added), "trufflehog"
              elif a.cmd == "semgrep":
                  rec, scanner = classify_semgrep(a.rc, _read(a.head), _read(a.base), a.rules, a.head_root, a.base_root,
                                                  a.scope, _tool(a)), "semgrep"
              elif a.cmd == "sca":
                  rec, scanner = classify_sca(_int(a.rc_head), _read(a.head), _int(a.rc_base), _read(a.base),
                                              a.head_root, a.base_root, a.scope, _tool(a), _read(a.head_err),
                                              _read(a.base_err)), "sca"
              elif a.cmd == "trivy":
                  rec, scanner = classify_trivy(a.rc, a.image, _tool(a)), "trivy"
              else:  # exceptions
                  today = (datetime.date.fromisoformat(a.today) if a.today
                           else datetime.datetime.now(datetime.timezone.utc).date())
                  rec, scanner = classify_exceptions(_read(a.gitleaks_toml), _read(a.gitleaksignore), today), "gitleaks"
              append(rdir, scanner, rec)
              print("%s/%s: %s: %s" % (scanner, rec["check"], rec["state"], rec["reason"]))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          TRUSTED_SCANSTATE_PY
          python3 -I "$d/scanstate.py" --help > /dev/null
          python3 --version
      # Full history of commits and trees, but no blobs until needed: the measured cost of this job was the
      # full-history checkout (p50 29 s of 53 s on the bridge), and gitleaks reads only the range's blobs.
      # Sparse keeps the root files (.gitleaks.toml, .gitleaksignore) and .github in the working tree.
      # The daily full-history scan (schedule / workflow_dispatch) reads every blob, so it fetches them all at once.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'blob:none' || '' }}
          sparse-checkout: .github
      - name: Resolve the scan range (a full-history scan when no range can be bound; never one commit)
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          lower=""
          mode=range
          readable() { [ -n "$1" ] && [ "$1" != "$zero" ] && git cat-file -e "${1}^{commit}" 2>/dev/null; }
          case "$EVENT" in
            pull_request)
              head="$PR_HEAD"
              # An unresolvable merge-base leaves the range empty: the scan step records UNAVAILABLE and fails.
              lower="$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || true)"
              how="pull request: merge-base(base, head)..head" ;;
            schedule|workflow_dispatch)
              head="$PUSH_AFTER"; mode=full
              how="$EVENT: full history of $head" ;;
            push)
              head="$PUSH_AFTER"
              # After a force-push the old head is on no branch, so the clone may lack it; ask for it by SHA.
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] && ! readable "$PUSH_BEFORE"; then
                git fetch --no-tags --quiet origin "$PUSH_BEFORE" 2>/dev/null || true
              fi
              if readable "$PUSH_BEFORE" && git merge-base --is-ancestor "$PUSH_BEFORE" "$head"; then
                lower="$PUSH_BEFORE"
                how="push: before..after"
              else
                # A new branch (before is all zeros), a force-push, or a before that cannot be read: no range can
                # be bound, so the whole history is scanned. Never the pushed commit alone.
                mode=full
                how="push with no usable before ($PUSH_BEFORE): full history of $head"
              fi ;;
            *) echo "::error::unsupported event $EVENT"; exit 1 ;;
          esac
          commits=0
          if [ "$mode" = full ]; then
            commits="$(git rev-list --count "$head")"
          elif [ -n "$lower" ]; then
            commits="$(git rev-list --count "${lower}..${head}")"
          fi
          echo "scan: mode=$mode ${lower:-root}..${head} = $commits commit(s) [$how]"
          { echo "mode=$mode"; echo "lower=$lower"; echo "head=$head"; echo "commits=$commits"; } >> "$GITHUB_OUTPUT"
      # The checkout above is blob-less (filter: blob:none) and sparse, so blobs arrive on demand. A scanner
      # that meets a missing blob does NOT fail: measured on gitleaks 8.30.1, a lazy fetch that fails gives
      # "0 commits scanned", "no leaks found" and rc 0. So every blob `git log -p` reads for the range (both
      # sides of every change, every parent of a merge) is fetched here in ONE batch, and the job stops if any
      # is still missing. Rename detection is off for the listing only, which lists both sides of a rename anyway.
      - name: Fetch every blob the scan range reads (blob-less checkout; stops if any is missing)
        env:
          MODE: ${{ steps.range.outputs.mode }}
          LOWER: ${{ steps.range.outputs.lower }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          COMMITS: ${{ steps.range.outputs.commits }}
        run: |
          set -euo pipefail
          if [ "$COMMITS" -le 0 ]; then echo "empty or unresolved range: nothing to fetch (the scan step records the state)"; exit 0; fi
          T="$RUNNER_TEMP/hydrate"; mkdir -p "$T"
          revs="${LOWER}..${HEAD_SHA}"
          [ "$MODE" = full ] && revs="$HEAD_SHA"   # full history: every commit reachable from head
          git log --format= --raw --no-abbrev --no-renames -m "$revs" \
            | awk '/^:/{ if ($1 != ":160000") print $3; if ($2 != "160000") print $4 }' \
            | { grep -v '^0\{40\}$' || true; } | sort -u > "$T/need"
          git cat-file --batch-all-objects --batch-check='%(objectname)' | sort -u > "$T/have"
          comm -23 "$T/need" "$T/have" > "$T/missing"
          echo "range $revs: $(wc -l < "$T/need") blob(s) read, $(wc -l < "$T/missing") to fetch"
          if [ -s "$T/missing" ]; then
            git -c fetch.negotiationAlgorithm=noop fetch --quiet --no-tags --no-write-fetch-head \
              --recurse-submodules=no --filter=blob:none --stdin origin < "$T/missing"
          fi
          git cat-file --batch-all-objects --batch-check='%(objectname)' | sort -u > "$T/have"
          comm -23 "$T/need" "$T/have" > "$T/still"
          if [ -s "$T/still" ]; then
            echo "::error::$(wc -l < "$T/still") blob(s) the scan range reads are still missing; refusing a partial scan"
            exit 1
          fi
      # Reuse the existing copy-then-hash cache; a cache miss still needs verified downloaded bytes.
      - name: Fetch pinned gitleaks archive
        uses: vagarylabs/.github/actions/fetch-release-asset@3014f2b6ead1a935d75f28e7e2dd173e0fd9b1b0
        timeout-minutes: 5
        with:
          tool: gitleaks
          version: ${{ env.GITLEAKS_VERSION }}
          url: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          sha256: ${{ env.GITLEAKS_SHA256 }}
          dest: ${{ runner.temp }}/gitleaks.tar.gz
          max-time: "90"
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          [ "$(uname -s)-$(uname -m)" = "Linux-x86_64" ] || { echo "::error::gitleaks pin is linux_x64; runner is $(uname -s)-$(uname -m)"; exit 1; }
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version | grep -qx "$GITLEAKS_VERSION"
      # gitleaks reads .gitleaks.toml (--config) and .gitleaksignore (auto) from the WORKING TREE. With a sparse,
      # blob-less checkout, a config that is in the commit but not materialised would make the scan below fall
      # back to gitleaks' defaults SILENTLY (measured: allowlist and ignore both dropped). So each one must be
      # absent from the commit, or present as exactly the committed blob; anything else stops the job.
      - name: Require the gitleaks config the scan reads (present as committed, or absent from the commit)
        run: |
          set -euo pipefail
          rev="$(git rev-parse HEAD)"
          for f in .gitleaks.toml .gitleaksignore; do
            entry="$(git ls-tree "$rev" -- "$f")"            # trees only: authoritative, never needs a blob
            if [ -z "$entry" ]; then
              if [ -e "$f" ]; then echo "::error::$f is in the working tree but not in $rev; refusing"; exit 1; fi
              echo "$f: not in $rev (gitleaks uses its default for it, as before)"; continue
            fi
            read -r _mode type oid _ <<<"$entry"
            [ "$type" = blob ] || { echo "::error::$f at $rev is a $type, not a file; refusing"; exit 1; }
            git cat-file -e "$rev:$f" || { echo "::error::$f blob $oid at $rev is not readable; refusing to scan with a default config"; exit 1; }
            [ -f "$f" ] || { echo "::error::$f is in $rev but missing from the working tree (sparse/blob-less checkout); refusing to scan with a default config"; exit 1; }
            [ "$(git hash-object -- "$f")" = "$oid" ] || { echo "::error::$f in the working tree does not match $rev:$f ($oid); refusing"; exit 1; }
            echo "$f: present, matches $rev:$f ($oid)"
          done
          # An [extend] path would make gitleaks read one more repository file; none of the callers uses one.
          if [ -f .gitleaks.toml ] && grep -qE '^[[:space:]]*path[[:space:]]*=' .gitleaks.toml; then
            echo "::error::.gitleaks.toml extends a repository file; this job does not verify extended config; refusing"; exit 1
          fi
      - name: gitleaks
        env:
          MODE: ${{ steps.range.outputs.mode }}
          LOWER: ${{ steps.range.outputs.lower }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          COMMITS: ${{ steps.range.outputs.commits }}
        run: |
          set -euo pipefail
          range="${LOWER:-unresolved}..${HEAD_SHA}"
          [ "$MODE" = full ] && range="$HEAD_SHA"   # full history: every commit reachable from head
          report="$RUNNER_TEMP/gitleaks-report.json"
          log="$RUNNER_TEMP/gitleaks.log"
          rm -f "$report"
          : > "$log"
          rc=0
          if [ "$COMMITS" -gt 0 ]; then
            echo "scanning commits: $range ($COMMITS commit(s), mode $MODE)"
            cfg=()
            [ -f .gitleaks.toml ] && cfg=(--config .gitleaks.toml)
            set +e
            "$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --exit-code 42 "${cfg[@]}" --log-opts="$range" \
              --report-format json --report-path "$report" . 2> "$log"
            rc=$?
            set -e
            cat "$log" >&2
          fi
          # --log: gitleaks must REPORT a scanned-commit count above 0, not just exit 0 (positive control).
          python3 -I "$RUNNER_TEMP/trusted/scanstate.py" gitleaks --rc "$rc" --report "$report" \
            --commits "$COMMITS" --scope "$range" --log "$log" \
            --tool-name gitleaks --tool-version "$GITLEAKS_VERSION" --tool-sha256 "$GITLEAKS_SHA256"
      - name: Scan state (gitleaks)
        if: ${{ !cancelled() }}
        run: python3 -I "$RUNNER_TEMP/trusted/scanstate.py" gate --scanner gitleaks --expect scan

  trufflehog:
    name: trufflehog (verified only)
    runs-on: ${{ inputs.runner != 'ubuntu-latest' && inputs.runner || vars.SECRET_SCAN_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      TRUFFLEHOG_VERSION: "3.97.0"
      TRUFFLEHOG_SHA256: "62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4"
    steps:
      # Every step below reports into one recorder; the final gate step merges what was recorded, and a check
      # it expects but nobody recorded (a failed or skipped step) is UNAVAILABLE, never a pass.
      - name: Install the scan-state recorder (inline copy of trusted/scanstate.py)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/trusted"
          mkdir -p "$d" "$RUNNER_TEMP/scan-records"
          cat > "$d/scanstate.py" <<'TRUSTED_SCANSTATE_PY'
          #!/usr/bin/env python3
          """Scan result states for the Vagary Labs scan workflows (ledger C9). Stdlib only, Python >= 3.8.

          Every scanner job ends in exactly ONE state:
            PASSED                the scanner ran to completion over the full declared scope; nothing at threshold.
            FINDINGS              it ran and found something at threshold. Blocks.
            UNAVAILABLE           it did not run to completion, or the scope was not covered (tool fetch failed,
                                  empty or unresolvable range, verifier unreachable, scanner error). Blocks, like FINDINGS.
            NOT_APPLICABLE        a recorded, printed predicate says this change has nothing for the scanner.
            AUTHORIZED_EXCEPTION  a finding or unavailability is waived by an unexpired, approved register entry.
          A gate passes only on PASSED, NOT_APPLICABLE or AUTHORIZED_EXCEPTION. A scanner listed in REPORT_ONLY
          records its state the same way but never fails the job.

          This file is the single source. Workflows carry a byte-identical inline copy (a heredoc rendered by
          trusted/render.py), because a ruleset workflow must not read code from the repository it judges.

          Each step appends one record (one check) to <records>/<scanner>.jsonl; `gate` merges them. A check that
          `gate --expect` names but nobody recorded is UNAVAILABLE: a skipped or failed step can never read as a pass.

          Nothing here prints a secret: findings are reported as rule, path, line and commit only.
          """
          import argparse
          import collections
          import datetime
          import hashlib
          import json
          import os
          import re
          import sys

          STATES = ("PASSED", "FINDINGS", "UNAVAILABLE", "NOT_APPLICABLE", "AUTHORIZED_EXCEPTION")
          PASSING = ("PASSED", "NOT_APPLICABLE", "AUTHORIZED_EXCEPTION")
          # Lower is worse. A job's state is the worst of its checks.
          RANK = {"FINDINGS": 0, "UNAVAILABLE": 1, "AUTHORIZED_EXCEPTION": 2, "PASSED": 3, "NOT_APPLICABLE": 4}

          # REPORT-ONLY scanners record a state but never fail the job. Flip one to False (and bump the ruleset pin)
          # only when the criterion in trusted/README.md ("Report-only to required") is met for it.
          REPORT_ONLY = {"gitleaks": False, "trufflehog": False, "semgrep": True, "sca": True}

          GITLEAKS_FINDINGS_RC = 42   # passed as --exit-code, so a gitleaks ERROR (exit 1) cannot read as findings
          SEMGREP_THRESHOLD = ("ERROR", "WARNING")
          MAX_LISTED = 50
          EXPIRY_MAX_DAYS = 90
          SCHEMA = "vagarylabs.scan-result/v1"


          def die(msg):
              raise SystemExit("scanstate: " + msg)


          # --- records ---------------------------------------------------------------------------------

          def records_dir(arg=None):
              d = arg or os.environ.get("SCAN_RECORDS") or os.path.join(os.environ.get("RUNNER_TEMP") or ".", "scan-records")
              os.makedirs(d, exist_ok=True)
              return d


          def make_check(check, state, reason, counts=None, items=None, tool=None, scope=None):
              if state not in STATES:
                  die("unknown state %r" % state)
              return {"check": check, "state": state, "reason": reason, "counts": counts or {},
                      "items": (items or [])[:MAX_LISTED], "items_total": len(items or []),
                      "tool": tool or {}, "scope": scope or ""}


          def append(rdir, scanner, rec):
              with open(os.path.join(rdir, scanner + ".jsonl"), "a", encoding="utf-8") as fh:
                  fh.write(json.dumps(rec, sort_keys=True) + "\n")


          def load(rdir, scanner):
              path = os.path.join(rdir, scanner + ".jsonl")
              out = []
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as fh:
                      for line in fh:
                          if line.strip():
                              out.append(json.loads(line))
              return out


          def merge(records, expect):
              """(state, reason, checks). Missing expected checks are UNAVAILABLE; no record at all is UNAVAILABLE."""
              checks = list(records)
              seen = {r["check"] for r in checks}
              for name in expect:
                  if name not in seen:
                      checks.append(make_check(name, "UNAVAILABLE",
                                               "no result recorded for check '%s': a step before it failed or was skipped" % name))
              if not checks:
                  checks.append(make_check("scan", "UNAVAILABLE", "no result recorded: the scanner never reported"))
              worst = min(checks, key=lambda r: RANK[r["state"]])
              return worst["state"], worst["reason"], checks


          def gate_exit(scanner, state, report_only=None):
              ro = REPORT_ONLY.get(scanner, False) if report_only is None else report_only
              if ro:
                  return 0
              return 0 if state in PASSING else 1


          # --- scanner-reported coverage (positive control) ---------------------------------------------
          # The range's commit count says what SHOULD be scanned; these read what the scanner SAYS it scanned, so a scanner
          # that resolved nothing (a missing object, a range it could not walk) cannot pass on a non-empty range.

          ANSI = re.compile(r"\x1b\[[0-9;]*m")


          def gitleaks_commits_scanned(log_text):
              """N from gitleaks' 'N commits scanned.' log line; None when absent."""
              if log_text is None:
                  return None
              m = re.findall(r"\b(\d+) commits? scanned", ANSI.sub("", log_text))
              return int(m[-1]) if m else None


          def trufflehog_finished(log_text):
              """(chunks, bytes) from trufflehog's JSON 'finished scanning' log line; None when absent."""
              for line in (log_text or "").splitlines():
                  try:
                      r = json.loads(line)
                  except ValueError:
                      continue
                  if isinstance(r, dict) and r.get("msg") == "finished scanning":
                      try:
                          return int(r.get("chunks")), int(r.get("bytes"))
                      except (TypeError, ValueError):
                          return None
              return None


          # --- gitleaks --------------------------------------------------------------------------------

          def classify_gitleaks(rc, report_text, commits, scope, tool=None, log_text=None):
              if commits is not None and commits <= 0:
                  return make_check("scan", "UNAVAILABLE", "empty scan range %s: nothing was scanned" % scope, tool=tool, scope=scope)
              if rc not in (0, GITLEAKS_FINDINGS_RC):
                  return make_check("scan", "UNAVAILABLE", "gitleaks exited %d (an error, not a finding)" % rc, tool=tool, scope=scope)
              if log_text is not None:
                  n = gitleaks_commits_scanned(log_text)
                  if n is None:
                      return make_check("scan", "UNAVAILABLE", "gitleaks did not report how many commits it scanned in %s" % scope,
                                        tool=tool, scope=scope)
                  if n <= 0:
                      return make_check("scan", "UNAVAILABLE", "gitleaks reported %d commits scanned over a non-empty range %s "
                                        "(%s commit(s)): nothing was read" % (n, scope, commits), tool=tool, scope=scope)
              try:
                  rows = json.loads(report_text) if report_text is not None else None
              except ValueError:
                  rows = None
              if not isinstance(rows, list):
                  return make_check("scan", "UNAVAILABLE", "gitleaks report missing or unreadable; completeness not proven",
                                    tool=tool, scope=scope)
              items = [{"rule": r.get("RuleID"), "path": r.get("File"), "line": r.get("StartLine"),
                        "commit": (r.get("Commit") or "")[:12]} for r in rows if isinstance(r, dict)]
              if rc == GITLEAKS_FINDINGS_RC or items:
                  if not items:
                      return make_check("scan", "UNAVAILABLE", "gitleaks signalled findings but its report lists none",
                                        tool=tool, scope=scope)
                  return make_check("scan", "FINDINGS", "%d gitleaks finding(s) in %s" % (len(items), scope),
                                    {"findings": len(items)}, items, tool, scope)
              return make_check("scan", "PASSED", "gitleaks scanned %s: no findings" % scope,
                                {"findings": 0, "commits": commits if commits is not None else -1}, tool=tool, scope=scope)


          # --- trufflehog ------------------------------------------------------------------------------

          def _cause(err):
              e = (err or "").lower()
              for key, words in (("connection-refused", ("connection refused",)),
                                 ("timeout", ("timeout", "deadline exceeded", "timed out")),
                                 ("dns", ("no such host", "lookup ", "server misbehaving")),
                                 ("tls", ("tls", "x509", "certificate")),
                                 ("proxy", ("proxyconnect", "proxy")),
                                 ("http-status", ("status code", "unexpected http", "unexpected response", "429", "5xx"))):
                  if any(w in e for w in words):
                      return key
              return "other"


          def _thog_location(r):
              meta = ((r.get("SourceMetadata") or {}).get("Data") or {})
              git = meta.get("Git") or meta.get("Filesystem") or {}
              return git.get("file"), git.get("line"), (git.get("commit") or "")[:12]


          def classify_trufflehog(rc, results_text, commits, scope, tool=None, log_text=None, added=None):
              """Input is trufflehog --json --results=verified,unknown output. A verified result is a live credential
              (FINDINGS). An unknown result means verification was attempted and errored, e.g. the provider was
              unreachable: that candidate was NOT cleared, so the scan is UNAVAILABLE, never PASSED."""
              if commits is not None and commits <= 0:
                  return make_check("scan", "UNAVAILABLE", "empty scan range %s: nothing was scanned" % scope, tool=tool, scope=scope)
              if rc != 0:
                  return make_check("scan", "UNAVAILABLE", "trufflehog exited %d (scan error)" % rc, tool=tool, scope=scope)
              if log_text is not None:
                  fin = trufflehog_finished(log_text)
                  if fin is None:
                      return make_check("scan", "UNAVAILABLE", "trufflehog did not log 'finished scanning' for %s" % scope,
                                        tool=tool, scope=scope)
                  if added and fin[0] <= 0:
                      return make_check("scan", "UNAVAILABLE", "trufflehog scanned 0 chunks over %s, which adds %d line(s): "
                                        "nothing was read" % (scope, added), tool=tool, scope=scope)
              if results_text is None:
                  return make_check("scan", "UNAVAILABLE", "trufflehog output missing", tool=tool, scope=scope)
              verified, unknown = [], []
              for n, line in enumerate(results_text.splitlines(), 1):
                  if not line.strip():
                      continue
                  try:
                      r = json.loads(line)
                  except ValueError:
                      return make_check("scan", "UNAVAILABLE", "trufflehog output line %d is not JSON" % n, tool=tool, scope=scope)
                  if not isinstance(r, dict):
                      return make_check("scan", "UNAVAILABLE", "trufflehog output line %d is not an object" % n, tool=tool, scope=scope)
                  path, ln, commit = _thog_location(r)
                  item = {"rule": r.get("DetectorName"), "path": path, "line": ln, "commit": commit}
                  if r.get("Verified") is True:
                      verified.append(item)
                  elif r.get("VerificationError"):
                      item["cause"] = _cause(r.get("VerificationError"))
                      unknown.append(item)
              counts = {"verified": len(verified), "verification_errors": len(unknown)}
              if verified:
                  return make_check("scan", "FINDINGS", "%d verified live credential(s) in %s" % (len(verified), scope),
                                    counts, verified + unknown, tool, scope)
              if unknown:
                  causes = sorted({i["cause"] for i in unknown})
                  dets = sorted({str(i["rule"]) for i in unknown})
                  return make_check("scan", "UNAVAILABLE",
                                    "verification could not complete for %d candidate(s) (detectors %s; cause %s); "
                                    "they are not cleared" % (len(unknown), ", ".join(dets), ", ".join(causes)),
                                    counts, unknown, tool, scope)
              return make_check("scan", "PASSED", "trufflehog scanned %s: no verified or unverifiable candidate" % scope,
                                counts, tool=tool, scope=scope)


          # --- semgrep ---------------------------------------------------------------------------------

          def _semgrep_keys(doc, root):
              keys = collections.Counter()
              items = []
              for r in doc.get("results") or []:
                  sev = ((r.get("extra") or {}).get("severity") or "").upper()
                  if sev not in SEMGREP_THRESHOLD:
                      continue
                  path = r.get("path") or ""
                  start = (r.get("start") or {}).get("line") or 0
                  end = (r.get("end") or {}).get("line") or start
                  text = ""
                  try:
                      with open(os.path.join(root, path), encoding="utf-8", errors="replace") as fh:
                          text = "".join(fh.readlines()[max(start - 1, 0):end])
                  except OSError:
                      pass
                  digest = hashlib.sha256(re.sub(r"\s+", " ", text).strip().encode()).hexdigest()
                  key = (r.get("check_id"), path, digest)
                  keys[key] += 1
                  items.append((key, {"rule": r.get("check_id"), "path": path, "line": start, "severity": sev}))
              return keys, items


          def classify_semgrep(rc, head_text, base_text, rules, head_root, base_root, scope, tool=None):
              """Findings at or above SEMGREP_THRESHOLD in the PR's changed files that the same files at the
              merge-base do not already carry (matched by rule, path and normalised matched text)."""
              if rules <= 0:
                  return make_check("scan", "UNAVAILABLE", "no semgrep rules loaded", tool=tool, scope=scope)
              if rc != 0:
                  return make_check("scan", "UNAVAILABLE", "semgrep exited %d" % rc, tool=tool, scope=scope)
              try:
                  head = json.loads(head_text)
                  base = json.loads(base_text) if base_text else {"results": [], "errors": []}
              except (TypeError, ValueError):
                  return make_check("scan", "UNAVAILABLE", "semgrep JSON missing or unreadable", tool=tool, scope=scope)
              errors = (head.get("errors") or []) + (base.get("errors") or [])
              if errors:
                  kinds = collections.Counter(str(e.get("type") if not isinstance(e.get("type"), list) else e["type"][0])
                                              for e in errors)
                  return make_check("scan", "UNAVAILABLE", "semgrep reported %d error(s): %s; the scope is not fully covered"
                                    % (len(errors), ", ".join("%s=%d" % kv for kv in sorted(kinds.items()))),
                                    {"errors": len(errors)}, tool=tool, scope=scope)
              hk, hitems = _semgrep_keys(head, head_root)
              bk, _ = _semgrep_keys(base, base_root)
              new = hk - bk
              items, budget = [], collections.Counter(new)
              for key, item in hitems:
                  if budget[key] > 0:
                      budget[key] -= 1
                      items.append(item)
              counts = {"rules": rules, "head_findings": sum(hk.values()), "base_findings": sum(bk.values()),
                        "new_findings": len(items)}
              if items:
                  return make_check("scan", "FINDINGS", "%d new semgrep finding(s) at %s in %s"
                                    % (len(items), "/".join(SEMGREP_THRESHOLD), scope), counts, items, tool, scope)
              return make_check("scan", "PASSED", "semgrep: no new finding at %s in %s" % ("/".join(SEMGREP_THRESHOLD), scope),
                                counts, tool=tool, scope=scope)


          # --- SCA (osv-scanner) -----------------------------------------------------------------------

          OSV_OK = (0, 1)        # 0 clean, 1 vulnerabilities found
          OSV_NO_PACKAGES = 128  # treated as an empty set: the lockfile exists and lists nothing
          # 129 API failed, 130 invalid config, 127 any other error: all UNAVAILABLE (osv-scanner v2.7.0 run.go).


          def _rel(src, root):
              for r in {root, os.path.realpath(root)} if root else ():
                  r = r.rstrip("/") + "/"
                  for s in (src, "/" + src.lstrip("/")):
                      if s.startswith(r):
                          return s[len(r):]
              return src


          OSV_ERROR_LINE = re.compile(r"^\s*(error|fatal)\b", re.I | re.M)


          def _osv_keys(doc, root):
              keys = {}
              for res in (doc or {}).get("results") or []:
                  src = _rel((res.get("source") or {}).get("path") or "", root)
                  for p in res.get("packages") or []:
                      pkg = p.get("package") or {}
                      sev = {}
                      for g in p.get("groups") or []:
                          for vid in g.get("ids") or []:
                              sev[vid] = g.get("max_severity") or ""
                      for v in p.get("vulnerabilities") or []:
                          key = (src, pkg.get("ecosystem"), pkg.get("name"), v.get("id"))
                          keys[key] = {"rule": v.get("id"), "path": src, "package": "%s@%s" % (pkg.get("name"), pkg.get("version")),
                                       "ecosystem": pkg.get("ecosystem"), "severity": sev.get(v.get("id"), "")}
              return keys


          def classify_sca(rc_head, head_text, rc_base, base_text, head_root, base_root, scope, tool=None,
                           head_err=None, base_err=None):
              """Advisories on the changed lockfiles at head that the same lockfiles at the merge-base do not carry.
              osv-scanner can log an extraction error and still exit 1 on the packages it did read: that is a partial
              scope, so an error line on stderr is UNAVAILABLE as well."""
              for side, rc, err in (("head", rc_head, head_err), ("base", rc_base, base_err)):
                  if rc is None:
                      continue
                  if rc not in OSV_OK and rc != OSV_NO_PACKAGES:
                      why = {124: "timed out", 129: "advisory API unreachable", 130: "invalid config"}.get(rc, "scanner error")
                      return make_check("scan", "UNAVAILABLE", "osv-scanner (%s) exited %d: %s" % (side, rc, why), tool=tool, scope=scope)
                  if err and OSV_ERROR_LINE.search(err):
                      n = len(OSV_ERROR_LINE.findall(err))
                      return make_check("scan", "UNAVAILABLE", "osv-scanner (%s) logged %d error line(s) (e.g. a lockfile it could "
                                        "not extract or resolve): the scope is only partly covered" % (side, n), tool=tool, scope=scope)
              try:
                  head = json.loads(head_text) if rc_head in OSV_OK else {"results": []}
                  base = json.loads(base_text) if rc_base in OSV_OK else {"results": []}
              except (TypeError, ValueError):
                  return make_check("scan", "UNAVAILABLE", "osv-scanner JSON missing or unreadable", tool=tool, scope=scope)
              hk, bk = _osv_keys(head, head_root), _osv_keys(base, base_root)
              new = [hk[k] for k in sorted(set(hk) - set(bk), key=lambda k: tuple(str(x) for x in k))]
              counts = {"head_vulns": len(hk), "base_vulns": len(bk), "new_vulns": len(new)}
              if new:
                  return make_check("scan", "FINDINGS", "%d advisory(ies) introduced by the changed lockfiles in %s"
                                    % (len(new), scope), counts, new, tool, scope)
              return make_check("scan", "PASSED", "no advisory introduced by the changed lockfiles in %s" % scope,
                                counts, tool=tool, scope=scope)


          LOCKFILES = ("package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock",
                       "requirements.txt", "poetry.lock", "Pipfile.lock", "pdm.lock", "uv.lock", "go.mod",
                       "Cargo.lock", "Gemfile.lock", "composer.lock", "pom.xml", "gradle.lockfile", "mix.lock",
                       "pubspec.lock", "renv.lock", "packages.lock.json", "conan.lock")


          def is_lockfile(path):
              base = path.rsplit("/", 1)[-1]
              return base in LOCKFILES or bool(re.match(r"^requirements[-_.\w]*\.txt$", base))


          # --- trivy (for repo image workflows that adopt this file) ----------------------------------------

          TRIVY_FINDINGS_RC = 42  # the caller passes --exit-code 42: trivy also exits 1 on its own errors


          def classify_trivy(rc, image, tool=None):
              if rc == 0:
                  return make_check("scan", "PASSED", "trivy: no finding at threshold in %s" % image, tool=tool, scope=image)
              if rc == TRIVY_FINDINGS_RC:
                  return make_check("scan", "FINDINGS", "trivy reported findings at threshold in %s" % image, tool=tool, scope=image)
              return make_check("scan", "UNAVAILABLE", "trivy exited %d: an error (DB download, timeout or scan failure), "
                                "not a finding" % rc, tool=tool, scope=image)


          # --- allowlist / exception entries -----------------------------------------------------------

          TABLE = re.compile(r"^\s*\[\[?\s*([A-Za-z0-9_.\-]+)\s*\]\]?\s*(#.*)?$")
          ALLOWLIST_TABLES = ("allowlist", "allowlists", "rules.allowlist", "rules.allowlists")
          KEY = re.compile(r"^\s*(approver|expires)\s*=\s*(.+?)\s*(#.*)?$")
          IGNORE_META = re.compile(r'^#\s*exception:\s*approver\s*=\s*"([^"]+)"\s+expires\s*=\s*(\d{4}-\d{2}-\d{2})\s*$')
          DATE = re.compile(r'^"?(\d{4}-\d{2}-\d{2})"?$')


          def _check_entry(label, approver, expires, today, problems):
              if not approver:
                  problems.append("%s: no approver" % label)
              if not expires:
                  problems.append("%s: no expires date" % label)
                  return
              try:
                  exp = datetime.date.fromisoformat(expires)
              except ValueError:
                  problems.append("%s: expires %r is not a YYYY-MM-DD date" % (label, expires))
                  return
              if exp < today:
                  problems.append("%s: EXPIRED on %s (UTC); renew with a fresh approval or remove the entry" % (label, exp))
              elif (exp - today).days > EXPIRY_MAX_DAYS:
                  problems.append("%s: expires %s is more than %d days after %s (UTC)" % (label, exp, EXPIRY_MAX_DAYS, today))


          def check_gitleaks_toml(text, today):
              """Every [allowlist]/[[allowlists]]/[rules.allowlist]/[[rules.allowlists]] table must carry
              approver = "<who>" and expires = YYYY-MM-DD (UTC, at most EXPIRY_MAX_DAYS ahead). -> (entries, problems)."""
              problems, entries, cur = [], 0, None

              def close(c):
                  if c is not None:
                      _check_entry(".gitleaks.toml:%d [%s]" % (c["line"], c["name"]), c.get("approver"), c.get("expires"),
                                   today, problems)

              for n, line in enumerate((text or "").splitlines(), 1):
                  m = TABLE.match(line)
                  if m:
                      close(cur)
                      cur = None
                      if m.group(1) in ALLOWLIST_TABLES:
                          entries += 1
                          cur = {"line": n, "name": m.group(1)}
                      continue
                  if cur is None:
                      continue
                  k = KEY.match(line)
                  if k:
                      val = k.group(2)
                      if k.group(1) == "approver":
                          sm = re.match(r'^"([^"]*)"$', val) or re.match(r"^'([^']*)'$", val)
                          cur["approver"] = sm.group(1).strip() if sm else ""
                      else:
                          dm = DATE.match(val)
                          cur["expires"] = dm.group(1) if dm else val
              close(cur)
              return entries, problems


          def check_gitleaksignore(text, today):
              """Each fingerprint line must sit under a `# exception: approver="<who>" expires=YYYY-MM-DD` line in the
              same paragraph (no blank line between). -> (entries, problems)."""
              problems, entries, meta = [], 0, None
              for n, raw in enumerate((text or "").splitlines(), 1):
                  line = raw.strip()
                  if not line:
                      meta = None
                      continue
                  if line.startswith("#"):
                      m = IGNORE_META.match(line)
                      if m:
                          meta = (m.group(1).strip(), m.group(2))
                      elif line.lower().startswith("# exception:"):
                          problems.append(".gitleaksignore:%d: malformed exception line" % n)
                      continue
                  entries += 1
                  label = ".gitleaksignore:%d" % n
                  if meta is None:
                      problems.append("%s: fingerprint has no `# exception: approver=... expires=...` line above it" % label)
                  else:
                      _check_entry(label, meta[0], meta[1], today, problems)
              return entries, problems


          def classify_exceptions(toml_text, ignore_text, today):
              te, tp = check_gitleaks_toml(toml_text, today)
              ie, ip = check_gitleaksignore(ignore_text, today)
              problems = tp + ip
              counts = {"allowlist_tables": te, "ignore_fingerprints": ie, "invalid": len(problems)}
              items = [{"rule": "exception-register", "path": p.split(":", 1)[0], "line": None, "detail": p} for p in problems]
              if problems:
                  return make_check("exceptions", "FINDINGS", "%d allowlist entr(y/ies) invalid or expired: %s"
                                    % (len(problems), "; ".join(problems[:5])), counts, items)
              return make_check("exceptions", "PASSED", "%d allowlist table(s) and %d ignore fingerprint(s), all approved and "
                                "unexpired as of %s (UTC)" % (te, ie, today), counts)


          # --- output ----------------------------------------------------------------------------------

          def result_doc(scanner, state, reason, checks, report_only):
              env = os.environ.get
              return {
                  "schema": SCHEMA, "scanner": scanner, "state": state, "reason": reason,
                  "mode": "report-only" if report_only else "blocking",
                  "gate": "report-only" if report_only else ("pass" if state in PASSING else "fail"),
                  "repository": env("GITHUB_REPOSITORY"), "event": env("GITHUB_EVENT_NAME"),
                  "run_id": env("GITHUB_RUN_ID"), "run_attempt": env("GITHUB_RUN_ATTEMPT"), "job": env("GITHUB_JOB"),
                  "base": env("SCAN_BASE"), "head": env("SCAN_HEAD"), "merge_base": env("SCAN_MERGE_BASE"),
                  "generated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "generated_at_basis": "runner clock, UTC",
                  "checks": checks,
              }


          def summary_lines(doc):
              lines = ["### %s: **%s** (%s)" % (doc["scanner"], doc["state"], doc["mode"]), "",
                       "| check | state | scope | reason |", "|---|---|---|---|"]
              for c in doc["checks"]:
                  lines.append("| %s | %s | `%s` | %s |" % (c["check"], c["state"], c.get("scope") or "",
                                                             c["reason"].replace("|", "/")))
              listed = [i for c in doc["checks"] for i in c.get("items") or []]
              if listed:
                  lines += ["", "| rule | path | line | detail |", "|---|---|---|---|"]
                  for i in listed[:MAX_LISTED]:
                      lines.append("| %s | `%s` | %s | %s |" % (i.get("rule"), i.get("path"), i.get("line"),
                                                                i.get("detail") or i.get("cause") or i.get("severity") or ""))
              return lines


          def emit(scanner, doc, out_dir):
              path = os.path.join(out_dir, "scan-result-%s.json" % scanner)
              with open(path, "w", encoding="utf-8") as fh:
                  json.dump(doc, fh, indent=2, sort_keys=True)
                  fh.write("\n")
              text = "\n".join(summary_lines(doc)) + "\n"
              sp = os.environ.get("GITHUB_STEP_SUMMARY")
              if sp:
                  with open(sp, "a", encoding="utf-8") as fh:
                      fh.write(text)
              gp = os.environ.get("GITHUB_OUTPUT")
              if gp:
                  with open(gp, "a", encoding="utf-8") as fh:
                      fh.write("state=%s\n" % doc["state"])
              sys.stdout.write(text)
              level = "notice" if doc["state"] in PASSING or doc["mode"] == "report-only" else "error"
              print("::%s title=%s %s (%s)::%s" % (level, scanner, doc["state"], doc["mode"], doc["reason"].replace("\n", " ")))
              return path


          # --- CLI -------------------------------------------------------------------------------------

          def _read(path):
              if not path:
                  return None
              try:
                  with open(path, encoding="utf-8", errors="replace") as fh:
                      return fh.read()
              except OSError:
                  return None


          def _tool(a):
              return {k: v for k, v in (("name", getattr(a, "tool_name", None)), ("version", a.tool_version),
                                        ("sha256", a.tool_sha256)) if v}


          def _int(v):
              return None if v in (None, "") else int(v)


          def main(argv=None):
              ap = argparse.ArgumentParser(prog="scanstate")
              ap.add_argument("--records", default=None)
              sub = ap.add_subparsers(dest="cmd", required=True)

              def common(p, tool=True):
                  p.add_argument("--scope", default="")
                  if tool:
                      p.add_argument("--tool-name")
                      p.add_argument("--tool-version")
                      p.add_argument("--tool-sha256")

              p = sub.add_parser("record")
              p.add_argument("--scanner", required=True)
              p.add_argument("--check", required=True)
              p.add_argument("--state", required=True, choices=STATES)
              p.add_argument("--reason", required=True)
              common(p, tool=False)

              p = sub.add_parser("gitleaks")
              p.add_argument("--rc", type=int, required=True)
              p.add_argument("--report")
              p.add_argument("--commits", type=int)
              p.add_argument("--log", help="gitleaks stderr; asserts 'N commits scanned' with N > 0")
              common(p)

              p = sub.add_parser("trufflehog")
              p.add_argument("--rc", type=int, required=True)
              p.add_argument("--results")
              p.add_argument("--commits", type=int)
              p.add_argument("--log", help="trufflehog stderr (--json logs); asserts it finished and read a chunk")
              p.add_argument("--added", type=int, help="lines the range adds; >0 requires chunks > 0")
              common(p)

              p = sub.add_parser("semgrep")
              p.add_argument("--rc", type=int, required=True)
              p.add_argument("--head", required=True)
              p.add_argument("--base")
              p.add_argument("--head-root", required=True)
              p.add_argument("--base-root", default="")
              p.add_argument("--rules", type=int, required=True)
              common(p)

              p = sub.add_parser("sca")
              p.add_argument("--rc-head", default="")
              p.add_argument("--head")
              p.add_argument("--rc-base", default="")
              p.add_argument("--base")
              p.add_argument("--head-root", default="")
              p.add_argument("--base-root", default="")
              p.add_argument("--head-err")
              p.add_argument("--base-err")
              common(p)

              p = sub.add_parser("trivy")
              p.add_argument("--rc", type=int, required=True)
              p.add_argument("--image", required=True)
              common(p)

              p = sub.add_parser("exceptions")
              p.add_argument("--gitleaks-toml")
              p.add_argument("--gitleaksignore")
              p.add_argument("--today", help="YYYY-MM-DD, UTC; default: today's UTC date")

              p = sub.add_parser("is-lockfile")
              p.add_argument("paths", nargs="*")

              p = sub.add_parser("gate")
              p.add_argument("--scanner", required=True)
              p.add_argument("--expect", default="", help="comma-separated checks that must have been recorded")
              p.add_argument("--out", default=None, help="directory for scan-result-<scanner>.json")

              a = ap.parse_args(argv)
              if a.cmd == "is-lockfile":
                  for path in a.paths or sys.stdin.read().split("\n"):
                      if path and is_lockfile(path):
                          print(path)
                  return 0

              rdir = records_dir(a.records)
              if a.cmd == "gate":
                  state, reason, checks = merge(load(rdir, a.scanner), [x for x in a.expect.split(",") if x])
                  ro = REPORT_ONLY.get(a.scanner, False)
                  emit(a.scanner, result_doc(a.scanner, state, reason, checks, ro), a.out or rdir)
                  return gate_exit(a.scanner, state)

              if a.cmd == "record":
                  rec, scanner = make_check(a.check, a.state, a.reason, scope=a.scope), a.scanner
              elif a.cmd == "gitleaks":
                  rec, scanner = classify_gitleaks(a.rc, _read(a.report), a.commits, a.scope, _tool(a),
                                                     log_text=(_read(a.log) or "") if a.log else None), "gitleaks"
              elif a.cmd == "trufflehog":
                  rec, scanner = classify_trufflehog(a.rc, _read(a.results), a.commits, a.scope, _tool(a),
                                                       log_text=(_read(a.log) or "") if a.log else None, added=a.added), "trufflehog"
              elif a.cmd == "semgrep":
                  rec, scanner = classify_semgrep(a.rc, _read(a.head), _read(a.base), a.rules, a.head_root, a.base_root,
                                                  a.scope, _tool(a)), "semgrep"
              elif a.cmd == "sca":
                  rec, scanner = classify_sca(_int(a.rc_head), _read(a.head), _int(a.rc_base), _read(a.base),
                                              a.head_root, a.base_root, a.scope, _tool(a), _read(a.head_err),
                                              _read(a.base_err)), "sca"
              elif a.cmd == "trivy":
                  rec, scanner = classify_trivy(a.rc, a.image, _tool(a)), "trivy"
              else:  # exceptions
                  today = (datetime.date.fromisoformat(a.today) if a.today
                           else datetime.datetime.now(datetime.timezone.utc).date())
                  rec, scanner = classify_exceptions(_read(a.gitleaks_toml), _read(a.gitleaksignore), today), "gitleaks"
              append(rdir, scanner, rec)
              print("%s/%s: %s: %s" % (scanner, rec["check"], rec["state"], rec["reason"]))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          TRUSTED_SCANSTATE_PY
          python3 -I "$d/scanstate.py" --help > /dev/null
          python3 --version
      # Commits and trees only, to resolve the range (vagaris: 32 MiB of 150 MiB; core: 16 of 147). The scan
      # itself reads a separate shallow repository built below, because trufflehog `git` always `git clone`s
      # its file:// source (measured on 3.97.0: a second full pack copy, and a blob-less source cannot be
      # cloned at all).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - name: Resolve the scan range (a full-history scan when no range can be bound; never one commit)
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          lower=""
          mode=range
          readable() { [ -n "$1" ] && [ "$1" != "$zero" ] && git cat-file -e "${1}^{commit}" 2>/dev/null; }
          case "$EVENT" in
            pull_request)
              head="$PR_HEAD"
              # An unresolvable merge-base leaves the range empty: the scan step records UNAVAILABLE and fails.
              lower="$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || true)"
              how="pull request: merge-base(base, head)..head" ;;
            schedule|workflow_dispatch)
              head="$PUSH_AFTER"; mode=full
              how="$EVENT: full history of $head" ;;
            push)
              head="$PUSH_AFTER"
              # After a force-push the old head is on no branch, so the clone may lack it; ask for it by SHA.
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] && ! readable "$PUSH_BEFORE"; then
                git fetch --no-tags --quiet origin "$PUSH_BEFORE" 2>/dev/null || true
              fi
              if readable "$PUSH_BEFORE" && git merge-base --is-ancestor "$PUSH_BEFORE" "$head"; then
                lower="$PUSH_BEFORE"
                how="push: before..after"
              else
                # A new branch (before is all zeros), a force-push, or a before that cannot be read: no range can
                # be bound, so the whole history is scanned. Never the pushed commit alone.
                mode=full
                how="push with no usable before ($PUSH_BEFORE): full history of $head"
              fi ;;
            *) echo "::error::unsupported event $EVENT"; exit 1 ;;
          esac
          commits=0
          if [ "$mode" = full ]; then
            commits="$(git rev-list --count "$head")"
          elif [ -n "$lower" ]; then
            commits="$(git rev-list --count "${lower}..${head}")"
          fi
          echo "scan: mode=$mode ${lower:-root}..${head} = $commits commit(s) [$how]"
          { echo "mode=$mode"; echo "lower=$lower"; echo "head=$head"; echo "commits=$commits"; } >> "$GITHUB_OUTPUT"
      # Range mode: depth commits+2 from head holds every range commit (each lies within `commits` steps of head)
      # AND the lower bound's parents, which trufflehog's merge-base walk needs (measured: depth commits+1, with
      # the lower bound on the shallow boundary, is a scan error). Checked, not assumed: the lower bound must be
      # present and off the boundary and the shallow count must equal the range count; else deepen, then
      # unshallow, then fail. Full mode fetches everything. The token lives in this step's env only.
      - name: Build the scan repository (shallow to the range; full history in full mode)
        id: scanrepo
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.range.outputs.mode }}
          LOWER: ${{ steps.range.outputs.lower }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          COMMITS: ${{ steps.range.outputs.commits }}
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/scan"
          rm -rf "$scan"
          echo "dir=$scan" >> "$GITHUB_OUTPUT"
          if [ "$COMMITS" -le 0 ]; then echo "empty or unresolved range: nothing to build (the scan step records the state)"; exit 0; fi
          git init -q "$scan"
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$b64"
          fetch() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $b64" \
              git -C "$scan" fetch --quiet --no-tags --no-write-fetch-head --recurse-submodules=no "$@" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "+${HEAD_SHA}:refs/heads/scan"
          }
          complete() {
            git -C "$scan" cat-file -e "${LOWER}^{commit}" 2>/dev/null || return 1
            if [ -f "$scan/.git/shallow" ] && grep -qx "$LOWER" "$scan/.git/shallow"; then return 1; fi
            [ "$(git -C "$scan" rev-list --count "${LOWER}..${HEAD_SHA}")" = "$COMMITS" ]
          }
          if [ "$MODE" = full ]; then
            fetch
            [ "$(git -C "$scan" rev-list --count "$HEAD_SHA")" = "$COMMITS" ] \
              || { echo "::error::full-history scan repository does not hold all $COMMITS commit(s)"; exit 1; }
          else
            depth=$((COMMITS + 2))
            fetch --depth="$depth"
            tries=0
            until complete; do
              tries=$((tries + 1))
              if [ "$(git -C "$scan" rev-parse --is-shallow-repository)" != true ] || [ "$tries" -gt 3 ]; then
                echo "::error::scan repository cannot hold ${LOWER}..${HEAD_SHA} ($COMMITS commit(s)); refusing a partial scan"; exit 1
              elif [ "$tries" -le 2 ]; then echo "range not complete at this depth; deepening by $depth"; fetch --deepen="$depth"
              else echo "range still not complete; fetching full history"; fetch --unshallow
              fi
            done
          fi
          git -C "$scan" symbolic-ref HEAD refs/heads/scan
          git -C "$scan" read-tree HEAD   # trufflehog reads the index; no working tree is written
          revs="${LOWER}..${HEAD_SHA}"
          [ "$MODE" = full ] && revs="$HEAD_SHA"
          added="$(git -C "$scan" log --format= --numstat "$revs" | awk '$1 ~ /^[0-9]+$/ {s += $1} END {print s + 0}')"
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "scan repository: $(git -C "$scan" rev-list --count "$revs") commit(s) in $revs, shallow=$(git -C "$scan" rev-parse --is-shallow-repository), $added line(s) added"
      # A measured slow CDN must not force every scan to download this archive again.
      - name: Fetch pinned trufflehog archive
        uses: vagarylabs/.github/actions/fetch-release-asset@3014f2b6ead1a935d75f28e7e2dd173e0fd9b1b0
        timeout-minutes: 5
        with:
          tool: trufflehog
          version: ${{ env.TRUFFLEHOG_VERSION }}
          url: https://github.com/trufflesecurity/trufflehog/releases/download/v${{ env.TRUFFLEHOG_VERSION }}/trufflehog_${{ env.TRUFFLEHOG_VERSION }}_linux_amd64.tar.gz
          sha256: ${{ env.TRUFFLEHOG_SHA256 }}
          dest: ${{ runner.temp }}/trufflehog.tar.gz
          max-time: "90"
      - name: Install trufflehog (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/trufflehog.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" trufflehog
          "$RUNNER_TEMP/bin/trufflehog" --version
      - name: trufflehog
        env:
          MODE: ${{ steps.range.outputs.mode }}
          LOWER: ${{ steps.range.outputs.lower }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
          COMMITS: ${{ steps.range.outputs.commits }}
          SCAN_DIR: ${{ steps.scanrepo.outputs.dir }}
          ADDED: ${{ steps.scanrepo.outputs.added }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trufflehog.jsonl"
          log="$RUNNER_TEMP/trufflehog.log"
          : > "$out"
          : > "$log"
          scope="${LOWER:-unresolved}..${HEAD_SHA}"
          since=(--since-commit "$LOWER")
          if [ "$MODE" = full ]; then scope="$HEAD_SHA"; since=(); fi
          rc=0
          if [ "$COMMITS" -gt 0 ]; then
            # --results=verified,unknown keeps the candidates whose verification ERRORED; --only-verified
            # dropped them and exited 0 when the provider could not be reached. --fail-on-scan-errors: without
            # it, an unresolvable object logs "encountered errors during scan" and exits 0 (measured).
            set +e
            "$RUNNER_TEMP/bin/trufflehog" git "file://${SCAN_DIR}" --branch HEAD "${since[@]}" \
              --results=verified,unknown --json --fail-on-scan-errors --no-update > "$out" 2> "$log"
            rc=$?
            set -e
            cat "$log" >&2
          fi
          # --log/--added: trufflehog must log 'finished scanning' and, when the range adds lines, a chunk count > 0.
          python3 -I "$RUNNER_TEMP/trusted/scanstate.py" trufflehog --rc "$rc" --results "$out" \
            --commits "$COMMITS" --scope "$scope" --log "$log" --added "${ADDED:-0}" \
            --tool-name trufflehog --tool-version "$TRUFFLEHOG_VERSION" --tool-sha256 "$TRUFFLEHOG_SHA256"
      - name: Scan state (trufflehog)
        if: ${{ !cancelled() }}
        run: python3 -I "$RUNNER_TEMP/trusted/scanstate.py" gate --scanner trufflehog --expect scan
