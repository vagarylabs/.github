# Change-impact planner: decides which CI work a change can affect (deterministic operator
# ci.change-impact-plan; method and contract in plan.py's docstring).
#
# It is a STEP, not a job, so it adds no runner registration. Use it in the job that already classifies
# the change:
#
#   plan:
#     outputs:
#       mode: ${{ steps.plan.outputs.mode }}
#       run: ${{ steps.plan.outputs.run }}
#       matrices: ${{ steps.plan.outputs.matrices }}
#       plan_id: ${{ steps.plan.outputs.plan_id }}
#     steps:
#       - uses: actions/checkout@<sha>
#         with: {ref: "${{ github.sha }}", fetch-depth: 0}
#       - id: plan
#         uses: vagarylabs/.github/actions/change-impact-plan@<sha>
#
# and gate each job on the plan:
#   if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'full' || fromJSON(needs.plan.outputs.run).e2e) }}
# Always test `mode == 'full'` first: with no config the run map is empty, and full must still run everything.
# The required aggregator must account for every obligation. A policy-proven
# inapplicable obligation is not an executed test; missing/blocked evidence fails.
# Full plans use the caller's complete known roster even when config is absent.
#
# The script comes from this action's own ref (github.action_path), so pinning the action pins the planner.
# The repo config (.github/ci-plan.json) is read from the PR's BASE commit, so a change cannot reduce its own
# plan. Python 3 standard library only; no install.
name: change-impact-plan
description: Plan the CI work a change can affect; unknown impact runs the full suite.
inputs:
  config:
    description: Plan config path, relative to the repository root.
    required: false
    default: .github/ci-plan.json
  candidate-root:
    description: Existing checkout of the exact event candidate, relative to the workspace. Missing objects widen the plan.
    required: false
    default: .
  token:
    description: Token for reading immutable base and tested source checkouts.
    required: false
    default: ${{ github.token }}
  reuse:
    description: >-
      Compatibility input. Run-result reuse is not admitted by this action version;
      every selected obligation must execute. Dependency caches are unaffected.
    required: false
    default: "false"
  edge-check:
    description: >-
      Check immutable candidate readers against base policy. Unknown or undeclared readers widen
      to full validation; disabling this check also forces full. Requires the exact candidate checkout.
    required: false
    default: "true"
  merge-group:
    description: >-
      full | reduce. reduce lets a merge_group run narrow over the canonical target's cumulative change (the diff from
      the target branch tip, re-read before output, to the group head, under the target's policy). Opt-in; the
      default keeps every merge group FULL.
    required: false
    default: "full"
  source-query:
    description: >-
      off | witness. witness also asks the provider's compare API (with this action's token) which paths
      differ between the pinned base and candidate SHAs, under finite caps. A truncated, capped, throttled,
      malformed or disagreeing answer forces full; a complete agreeing answer changes nothing. It never narrows.
    required: false
    default: "off"
outputs:
  mode:
    description: full | reduced
    value: ${{ steps.plan.outputs.mode }}
  plan_id:
    description: Stable id of this plan (hash of its validity predicate and the changed paths).
    value: ${{ steps.plan.outputs.plan_id }}
  run:
    description: JSON object, job id -> bool.
    value: ${{ steps.plan.outputs.run }}
  matrices:
    description: JSON object, matrix name -> include list.
    value: ${{ steps.plan.outputs.matrices }}
  plan:
    description: The full decision record including information-only cumulative impact (JSON); impact grants no skip or reuse authority.
    value: ${{ steps.plan.outputs.plan }}
  tested:
    description: JSON identity of the tested tree (tree, lockfile and workflow hashes, planner version).
    value: ${{ steps.plan.outputs.tested }}
runs:
  using: composite
  steps:
    - name: Allocate attempt-local input state
      id: state
      shell: bash
      run: |
        set -euo pipefail
        state=$(mktemp -d "$GITHUB_WORKSPACE/.ci-plan.XXXXXX")
        echo "directory=$state" >> "$GITHUB_OUTPUT"
        echo "relative=${state#"$GITHUB_WORKSPACE/"}" >> "$GITHUB_OUTPUT"
    - name: Freeze canonical target before policy checkout
      id: target
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        TARGET_REF: ${{ github.event.merge_group.base_ref }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
        CANDIDATE: ${{ github.sha }}
        STATE: ${{ steps.state.outputs.directory }}
      run: |
        set -euo pipefail
        python3 -I "$GITHUB_ACTION_PATH/plan.py" --resolve-target --config .github/ci-plan.json --root "$STATE/base" \
          --event "$EVENT" --base "$BASE" --candidate "$CANDIDATE" --repository "$REPOSITORY" \
          --event-repository "$EVENT_REPOSITORY" --target-ref "$TARGET_REF" --server-url "$SERVER_URL" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
          --out-json "$STATE/target.json" --github-output "$GITHUB_OUTPUT"
    - name: Base commit manifests and plan config (sparse)
      id: policy
      continue-on-error: true
      if: ${{ steps.target.outputs.policy_ref != '' }}
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ steps.target.outputs.policy_ref }}
        path: ${{ steps.state.outputs.relative }}/base
        token: ${{ inputs.token }}
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          ${{ inputs.config }}
          /pnpm-workspace.yaml
          /pnpm-lock.yaml
          /package-lock.json
          /yarn.lock
          /poetry.lock
          /uv.lock
          **/package.json
          /.github/workflows/
    - name: Tested commit (lockfiles and workflows of the tree this run tests)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ github.sha }}
        path: ${{ steps.state.outputs.relative }}/tested
        token: ${{ inputs.token }}
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /pnpm-lock.yaml
          /package-lock.json
          /yarn.lock
          /poetry.lock
          /uv.lock
          /.github/workflows/
    - name: Assess immutable readers against the trusted base policy
      id: readers
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        STATE: ${{ steps.state.outputs.directory }}
        CANDIDATE_ROOT: ${{ inputs.candidate-root }}
        CANDIDATE: ${{ github.sha }}
        EDGE_CHECK: ${{ inputs.edge-check }}
        POLICY_OUTCOME: ${{ steps.policy.outcome }}
      run: |
        set -euo pipefail
        reason=""
        if [ "$POLICY_OUTCOME" != success ]; then
          reason="policy checkout unavailable; caller full roster required"
        elif [ "$EDGE_CHECK" != true ]; then
          reason="reader closure check disabled"
        elif [ ! -f "$STATE/base/$CONFIG" ]; then
          reason="no base policy; caller full roster required"
        elif ! python3 -I "$GITHUB_ACTION_PATH/edges.py" check --config "$STATE/base/$CONFIG" \
          --manifest-root "$STATE/base" --repo "$GITHUB_WORKSPACE/$CANDIDATE_ROOT" --revision "$CANDIDATE" \
          --out-json "$STATE/readers.json"; then
          reason="reader closure unproven; full validation required"
        fi
        echo "force_full_reason=$reason" >> "$GITHUB_OUTPUT"
    - name: Plan
      id: plan
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        CONFIG: ${{ inputs.config }}
        CANDIDATE: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
        EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
        TARGET_REF: ${{ github.event.merge_group.base_ref }}
        SERVER_URL: ${{ github.server_url }}
        GH_TOKEN: ${{ inputs.token }}
        POLICY_OUTCOME: ${{ steps.policy.outcome }}
        CANDIDATE_ROOT: ${{ inputs.candidate-root }}
        STATE: ${{ steps.state.outputs.directory }}
        FORCE_FULL_REASON: ${{ steps.readers.outputs.force_full_reason }}
        REPOSITORY_ID: ${{ github.repository_id }}
        REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        SOURCE_QUERY: ${{ inputs.source-query }}
        MERGE_GROUP: ${{ inputs.merge-group }}
        API_URL: ${{ github.api_url }}
      run: |
        set -euo pipefail
        python3 -I "$GITHUB_ACTION_PATH/plan.py" \
          --config "$CONFIG" --root "$STATE/base" \
          --tested-root "$STATE/tested" --scope-root "$GITHUB_WORKSPACE/$CANDIDATE_ROOT" \
          --candidate "$CANDIDATE" --repository "$REPOSITORY" --event-repository "$EVENT_REPOSITORY" \
          --repository-id "$REPOSITORY_ID" --repository-owner-id "$REPOSITORY_OWNER_ID" \
          --source-query "$SOURCE_QUERY" --api-url "$API_URL" --merge-group "$MERGE_GROUP" \
          --target-ref "$TARGET_REF" --server-url "$SERVER_URL" --target-observation "$STATE/target.json" \
          --policy-checkout-outcome "$POLICY_OUTCOME" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --force-full-reason "$FORCE_FULL_REASON" \
          --reader-assessment "$STATE/readers.json" \
          --event "$EVENT" --base "$BASE" --head "$HEAD" \
          --out-json "$STATE/plan.json" \
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" > /dev/null
        python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("plan", r["plan_id"] + ":", r["mode"], "-", r["reason"])' "$STATE/plan.json"
    - name: Remove attempt-local inputs
      if: ${{ always() && steps.state.outputs.directory != '' }}
      shell: bash
      env:
        STATE: ${{ steps.state.outputs.directory }}
      run: |
        case "$STATE" in
          "$GITHUB_WORKSPACE"/.ci-plan.*) rm -rf -- "$STATE" ;;
          *) echo "refusing unexpected planner state path" >&2; exit 1 ;;
        esac
