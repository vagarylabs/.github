# Full-run receipt: after a merge group's FULL suite has passed, record what it validated, so the push to main that
# fast-forwards to the SAME commit can reuse the run instead of running everything again (actions/full-run-reuse).
#
# Add it as a step of the REQUIRED verdict job (the aggregate the merge queue waits for), after its checks and before
# the job ends, only on success. The queue cannot merge before that job reports, so the receipt exists before the push
# looks for it:
#   - if: ${{ success() }}
#     uses: vagarylabs/.github/actions/full-run-receipt@<sha>
#     with:
#       full: ${{ <this run's selection is FULL, from the workflow's own selector> }}
#
# It writes nothing unless the event is merge_group AND `full` is exactly "true". A consumer with no selector passes
# "true" literally; that literal is reviewed with the workflow, which is part of the commit the receipt binds.
# The artifact is ~1 KB, named per attempt (a re-run never collides with an earlier attempt's receipt), kept 3 days.
name: full-run-receipt
description: Record a passed FULL merge-group run of this exact commit, for same-commit reuse by the push to main.
inputs:
  full:
    description: The string "true" when this run executed the FULL suite. Anything else writes no receipt.
    required: true
runs:
  using: composite
  steps:
    - id: write
      shell: bash
      env:
        FULL: ${{ inputs.full }}
        EVENT: ${{ github.event_name }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        HEAD_SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        JOB: ${{ github.job }}
      run: python3 -I "$GITHUB_ACTION_PATH/receipt.py"
    - if: ${{ steps.write.outputs.written != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ci-full-run-receipt-${{ steps.write.outputs.written }}
        path: ${{ runner.temp }}/ci-full-run/receipt.json
        retention-days: 3
        if-no-files-found: error
