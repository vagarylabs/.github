# Sibling repository read: a read-only installation token, ready for the repositories, then a clone or checkout.
# The token is minted here from a GitHub App (app-id + private-key), or it is broker-source-read's: `token-dir` names
# that action's mint directory, one 0600 file <owner>__<name> per repository (root's ruling 2026-10-29, core sibling-read
# path (a): composition, one broker client). Exactly one source per call. The App-key mode retires once C4 has landed on
# every consumer (check_no_source_read_app_key.py then enforces it fleet-wide).
# A clone within about a second of minting can be answered "Repository not found" (exit 128) with nothing wrong
# (vagaris #825, core #920, 2026-10-27), costing a full red cycle. This is the one place a workflow reads a sibling
# repository with a freshly minted App token; trusted-workflow-integrity refuses a raw create-github-app-token
# followed by a sibling clone or checkout anywhere else.
#
#   - uses: vagarylabs/.github/actions/sibling-repo-read@<commit sha>   # pin a SHA, never @main
#     with:
#       app-id: ${{ vars.SOURCE_READ_APP_ID }}
#       private-key: ${{ secrets.SOURCE_READ_APP_PRIVATE_KEY }}
#       repositories: vagary-core
#       bare: vagary-core:${{ runner.temp }}/core.git          # newline list repo:path, a bare clone of main
#       checkouts: vagary-voice:${{ runner.temp }}/siblings/vagary-voice   # newline list repo:dir, shallow, main's SHA
#
# Broker-backed (no App key): broker-source-read mints into a token directory and waits for readiness; this reads with
# it; broker-source-read revokes after the last use.
#
#   - uses: vagarylabs/.github/actions/broker-source-read@<commit sha>
#     with: {purpose: build_checkout, repository: vagarylabs/vagary-platform, token-dir: ${{ runner.temp }}/broker-tokens, ...}
#   - uses: vagarylabs/.github/actions/sibling-repo-read@<commit sha>
#     with:
#       token-dir: ${{ runner.temp }}/broker-tokens
#       repositories: vagary-platform
#       checkouts: vagary-platform:${{ runner.temp }}/siblings/vagary-platform
#   - if: ${{ always() }}
#     uses: vagarylabs/.github/actions/broker-source-read@<same sha>
#     with: {mode: revoke, purpose: build_checkout, token-dir: ${{ runner.temp }}/broker-tokens}
#
# Sparse, in two calls with the consumer's derive between them, so this action never runs repository code:
#   1. `trees: vagary-platform:<dir>`: main's commit at job start with its trees and no blob; output `trees` gives
#      the NUL-separated listing (<RUNNER_TEMP>/sibling-repo-read/vagary-platform.tree.z) and the commit;
#   2. the consumer writes its patterns (vagary-core: scripts/sibling_sparse.py derive --tree <listing>);
#   3. `sparse: vagary-platform:<dir>:<patterns file>`: exactly that set of exactly that commit, then no promisor, so a
#      read outside the set fails instead of fetching. Output `sparse-ok` names each repository that completed. To
#      fall back, remove <dir> and ask for `checkouts:` instead. Put `sparse:` in its own call when a fallback should
#      follow a failure (continue-on-error, keyed on sparse-ok).
#
# Readiness (App mode): GET <api>/repos/<owner>/<repo> must answer 200 for EVERY repository within readiness-seconds
# (default 60, one wall-clock bound for all), with backoff (1, 2, 4, 8 s). A 404 that persists fails by name: "App
# token cannot see <owner>/<repo> after 60 s: installation scope?". A first-time 200 costs no delay. In token-dir mode
# broker-source-read has already waited, so this action does not wait again.
# Script and tests: read.py, test_read.py; usage: README.md.
name: sibling-repo-read
description: Read sibling repositories with a read-only token (minted here from an App, or broker-source-read's token directory), then clone or check out.
inputs:
  app-id:
    description: The GitHub App id (App mode; with private-key, and never with token-dir).
    required: false
    default: ""
  private-key:
    description: The GitHub App private key (App mode; with app-id, and never with token-dir).
    required: false
    default: ""
  token-dir:
    description: broker-source-read's mint token-dir (strictly inside RUNNER_TEMP, one 0600 file <owner>__<name> per repository). Never with app-id or private-key.
    required: false
    default: ""
  owner:
    description: The repositories' owner.
    required: false
    default: vagarylabs
  repositories:
    description: Comma-separated repository names the token is scoped to (and the only ones this action reads).
    required: true
  bare:
    description: Newline-separated repo:path pairs, each a bare single-branch clone of main.
    required: false
    default: ""
  checkouts:
    description: Newline-separated repo:dir pairs, each a depth-1 checkout of main's commit at job start.
    required: false
    default: ""
  trees:
    description: Newline-separated repo:dir pairs, each phase 1 of a sparse read (main's commit, trees only, no checkout; the listing goes to the `trees` output).
    required: false
    default: ""
  sparse:
    description: Newline-separated repo:dir:patterns-file triples, each phase 2 of a sparse read, in a later call than its `trees`.
    required: false
    default: ""
  readiness-seconds:
    description: The readiness bound, in seconds, for all repositories together.
    required: false
    default: "60"
  packages:
    description: Empty, or `read` to add packages read (a GHCR pull of the listed repositories' packages; App mode only). Nothing else.
    required: false
    default: ""
outputs:
  token:
    description: The minted read-only installation token (contents read, plus packages read when asked), for a later read the action does not cover. Empty in token-dir mode, where the caller holds the files.
    value: ${{ steps.mint.outputs.token || steps.mint_packages.outputs.token }}
  trees:
    description: "JSON {repo: {dir, tree, sha}} for each `trees` entry; `tree` is the NUL-separated path listing to derive patterns from."
    value: ${{ steps.read.outputs.trees }}
  sparse-ok:
    description: Comma-separated repositories whose sparse checkout completed (a fallback is never listed).
    value: ${{ steps.read.outputs.sparse-ok }}
runs:
  using: composite
  steps:
    # LEAST PRIVILEGE (root's R4 of #37): the token is minted READ-ONLY, never with the App's full installation
    # permissions: contents read always, packages read only when asked. Any other `packages` value is refused here.
    # EXACTLY ONE TOKEN SOURCE (root's ruling 2026-10-29): the App (app-id and private-key, both) or broker-source-read's
    # token directory, never both and never neither, decided here before any token is minted or read. The key only
    # reaches this step as a yes/no, never its value.
    - id: scope
      shell: bash
      env:
        SIBLING_PACKAGES: ${{ inputs.packages }}
        SIBLING_HAS_APP_ID: ${{ inputs.app-id != '' }}
        SIBLING_HAS_KEY: ${{ inputs.private-key != '' }}
        SIBLING_HAS_DIR: ${{ inputs.token-dir != '' }}
      run: |
        case "$SIBLING_PACKAGES" in
          ""|read) ;;
          *) echo "::error::sibling-repo-read: packages must be empty or read, not '$SIBLING_PACKAGES'"; exit 1 ;;
        esac
        case "$SIBLING_HAS_APP_ID/$SIBLING_HAS_KEY/$SIBLING_HAS_DIR" in
          true/true/false) ;;
          false/false/true)
            if [ -n "$SIBLING_PACKAGES" ]; then
              echo "::error::sibling-repo-read: packages is App mode only; with token-dir the broker purpose fixes the permissions"; exit 1
            fi ;;
          */*/true) echo "::error::sibling-repo-read: give token-dir OR app-id + private-key, not both"; exit 1 ;;
          *) echo "::error::sibling-repo-read: give app-id and private-key together, or token-dir"; exit 1 ;;
        esac
    - id: mint
      if: ${{ inputs.token-dir == '' && inputs.packages == '' }}
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-contents: read
    - id: mint_packages
      if: ${{ inputs.token-dir == '' && inputs.packages == 'read' }}
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-contents: read
        permission-packages: read
    # The two steps that hold the token run in a RESET shell (root's class item on #37): job steps before this one may
    # run PR-controlled code, which can write GITHUB_PATH, GITHUB_ENV or BASH_ENV. So the shell is started by absolute
    # path with BASH_ENV, ENV and the dynamic-loader variables unset and PATH=/usr/bin:/bin, and read.py runs under
    # `python3 -I -S`: no PYTHON* variables, no user or site packages, no script-directory imports. A PR-built venv or
    # a python3 earlier on PATH never receives the token. This narrows the channel; it does not close it: code that
    # already runs in this job can still reach the runner itself. Minting before any PR code runs closes it.
    - id: ready
      if: ${{ inputs.token-dir == '' }}
      shell: /usr/bin/env -u BASH_ENV -u ENV -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH PATH=/usr/bin:/bin /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        SIBLING_TOKEN: ${{ steps.mint.outputs.token || steps.mint_packages.outputs.token }}
        SIBLING_API: ${{ github.api_url }}
        SIBLING_OWNER: ${{ inputs.owner }}
        SIBLING_REPOS: ${{ inputs.repositories }}
        SIBLING_BOUND: ${{ inputs.readiness-seconds }}
      run: |
        command -v python3 >/dev/null || { echo "::error::sibling-repo-read: no python3 on the reset PATH /usr/bin:/bin"; exit 1; }
        python3 -I -S "$GITHUB_ACTION_PATH/read.py" ready --api "$SIBLING_API" --owner "$SIBLING_OWNER" --repos "$SIBLING_REPOS" --bound "$SIBLING_BOUND"
    - id: read
      if: ${{ inputs.bare != '' || inputs.checkouts != '' || inputs.trees != '' || inputs.sparse != '' }}
      shell: /usr/bin/env -u BASH_ENV -u ENV -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH PATH=/usr/bin:/bin /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        SIBLING_TOKEN: ${{ steps.mint.outputs.token || steps.mint_packages.outputs.token }}
        SIBLING_SERVER: ${{ github.server_url }}
        SIBLING_OWNER: ${{ inputs.owner }}
        SIBLING_REPOS: ${{ inputs.repositories }}
        SIBLING_BARE: ${{ inputs.bare }}
        SIBLING_CHECKOUTS: ${{ inputs.checkouts }}
        SIBLING_TREES: ${{ inputs.trees }}
        SIBLING_SPARSE: ${{ inputs.sparse }}
        SIBLING_TOKEN_DIR: ${{ inputs.token-dir }}
      run: |
        args=()
        if [ -n "$SIBLING_TOKEN_DIR" ]; then args+=(--token-dir "$SIBLING_TOKEN_DIR"); fi
        while IFS= read -r pair; do [ -n "$pair" ] && args+=(--bare "$pair"); done <<< "$SIBLING_BARE"
        while IFS= read -r pair; do [ -n "$pair" ] && args+=(--checkout "$pair"); done <<< "$SIBLING_CHECKOUTS"
        while IFS= read -r pair; do [ -n "$pair" ] && args+=(--tree "$pair"); done <<< "$SIBLING_TREES"
        while IFS= read -r triple; do [ -n "$triple" ] && args+=(--sparse "$triple"); done <<< "$SIBLING_SPARSE"
        python3 -I -S "$GITHUB_ACTION_PATH/read.py" clone --server "$SIBLING_SERVER" --owner "$SIBLING_OWNER" --repos "$SIBLING_REPOS" "${args[@]}"
