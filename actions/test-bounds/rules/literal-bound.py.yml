# literal-bound, for python (.py). The positions are vps-ansible's #1140 gate's
# (scripts/test_subprocess_hang_guards.py): a `timeout` passed to a subprocess call (run, check_output, check_call,
# call, Popen, communicate, wait) by keyword or positionally (wait(N), communicate(input, N)), and the default of a
# `timeout` parameter, judged against the subprocess floor (seconds). K2 step 2 adds, each with its own kind:
#   condition: asyncio.wait_for / wait_for (positional or `timeout=`), asyncio.timeout / async_timeout.timeout, and an
#     HTTP client's `timeout=` (urlopen, requests.*, httpx.*);
#   subprocess: a thread or process `.join(timeout)` (a positional literal, or `timeout=`; a positional NAME is not
#     read, since str.join takes one);
#   fixture: a PostgreSQL client's timeout / connect_timeout / command_timeout (vagary-core #949's PG_CONNECT_CALLS);
#   case: pytest.mark.timeout(N).
# The first document holds the utils every rule carries; rule ids are `literal-bound.<position>.<kind>` as in
# literal-bound.yml.
utils:
  nc: { not: { kind: comment } }
  positional: { not: { any: [{ kind: keyword_argument }, { kind: comment }, { kind: list_splat }, { kind: dictionary_splat }] } }
  sp-name: { regex: "^(?:run|check_output|check_call|call|Popen|communicate|wait)$" }
  number-literal: { any: [{ kind: integer }, { kind: float }] }
  wait-for: { regex: "^(?:asyncio\\.)?wait_for$" }
  pg-call: { regex: "^(?:asyncpg\\.(?:pool\\.)?(?:connect|create_pool)|create_pool|psycopg2?\\.connect|psycopg\\.(?:Async)?Connection\\.connect|(?:psycopg_pool\\.)?(?:Async)?ConnectionPool)$" }
  http-call: { regex: "^(?:(?:urllib\\.request\\.)?urlopen|(?:requests|httpx)\\.(?:get|post|put|patch|delete|head|options|request|stream)|httpx\\.(?:Async)?Client)$" }
  sp-callee:
    any:
      - { kind: identifier, matches: sp-name }
      - { kind: attribute, has: { field: attribute, matches: sp-name } }
  # A value that cannot be a time bound (None is no bound at all, so it is not one either).
  bound-value:
    not:
      any:
        - { kind: string }
        - { kind: concatenated_string }
        - { kind: list }
        - { kind: dictionary }
        - { kind: set }
        - { kind: tuple }
        - { kind: lambda }
        - { kind: none }
        - { kind: "true" }
        - { kind: "false" }
        - { kind: list_splat }
        - { kind: dictionary_splat }
        - { kind: comment }
  # Poll loops (K2 step 2C, B; see literal-bound.yml): `for _ in range(N)` whose body sleeps a fixed V seconds
  # (time.sleep / asyncio.sleep) and can exit early (break or return) has the budget N x V. A deadline loop's budget is
  # D, from `now - t0 < D`, or from `now < deadline` with `deadline = now + D` in a preceding statement. A budget that
  # is a parameter of the enclosing function is judged where it is declared.
  poll-boundary: { any: [{ kind: function_definition }, { kind: lambda }, { kind: class_definition }] }
  poll-def: { any: [{ kind: function_definition }, { kind: class_definition }, { kind: decorated_definition }] }
  py-sleep:
    any:
      - all: [{ kind: call }, { has: { field: function, regex: "^(?:time\\.)?sleep$" } }, { has: { field: arguments, has: { nthChild: 1, all: [{ pattern: $V }, { not: { matches: py-param-budget } }] } } }]
      - all: [{ kind: await }, { has: { kind: call, all: [{ has: { field: function, regex: "^(?:asyncio\\.)?sleep$" } }, { has: { field: arguments, has: { nthChild: 1, all: [{ pattern: $V }, { not: { matches: py-param-budget } }] } } }] } }]
  py-exit: { any: [{ kind: break_statement }, { kind: return_statement }] }
  py-now:
    any:
      - pattern: time.monotonic()
      - pattern: time.time()
      - pattern: time.perf_counter()
      - pattern: monotonic()
      - pattern: perf_counter()
      - pattern: loop.time()
  py-now-plus:
    kind: binary_operator
    all:
      - has: { field: operator, regex: "^\\+$" }
      - any:
          - all: [{ has: { field: left, matches: py-now } }, { has: { field: right, all: [{ pattern: $V }, { not: { matches: py-param-budget } }] } }]
          - all: [{ has: { field: left, all: [{ pattern: $V }, { not: { matches: py-param-budget } }] } }, { has: { field: right, matches: py-now } }]
  py-deadline-binding: { kind: assignment, all: [{ has: { field: left, pattern: $D } }, { has: { field: right, matches: py-now-plus } }] }
  py-deadline-test:
    kind: comparison_operator
    all:
      - not: { has: { nthChild: 3 } }
      - has: { field: operators, regex: "^<=?$" }
      - any:
          - all: [{ has: { nthChild: 1, kind: binary_operator, all: [{ has: { field: operator, regex: "^-$" } }, { has: { field: left, matches: py-now } }] } }, { has: { nthChild: 2, all: [{ pattern: $V }, { not: { matches: py-param-budget } }] } }]
          - all:
              - has: { nthChild: 1, matches: py-now }
              - has: { nthChild: 2, kind: identifier, pattern: $D }
              - inside: { stopBy: end, follows: { stopBy: end, not: { matches: poll-def }, has: { stopBy: { matches: poll-boundary }, matches: py-deadline-binding } } }
  py-param-budget:
    all:
      - kind: identifier
      - inside: { stopBy: end, kind: function_definition, has: { field: parameters, has: { stopBy: end, pattern: $V } } }
  py-param-count:
    all:
      - kind: identifier
      - inside: { stopBy: end, kind: function_definition, has: { field: parameters, has: { stopBy: end, pattern: $N } } }
---
id: literal-bound.keyword.subprocess
language: python
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: "^timeout$" }
    - has: { field: value, pattern: $V, matches: bound-value }
  inside:
    kind: argument_list
    inside: { kind: call, has: { field: function, matches: sp-callee } }
---
# p.wait(N): the first positional argument.
id: literal-bound.positional.subprocess
language: python
rule:
  kind: call
  any:
    - all:
        - has:
            field: function
            any:
              - { kind: identifier, regex: "^wait$" }
              - { kind: attribute, has: { field: attribute, regex: "^wait$" } }
        - has:
            field: arguments
            has: { nthChild: { position: 1, ofRule: { matches: positional } }, pattern: $V, all: [{ matches: positional }, { matches: bound-value }] }
    - all:
        - has:
            field: function
            any:
              - { kind: identifier, regex: "^communicate$" }
              - { kind: attribute, has: { field: attribute, regex: "^communicate$" } }
        - has:
            field: arguments
            has: { nthChild: { position: 2, ofRule: { matches: positional } }, pattern: $V, all: [{ matches: positional }, { matches: bound-value }] }
---
# def f(cmd, timeout=45) / lambda timeout=45: ...
id: literal-bound.default.subprocess
language: python
rule:
  any:
    - kind: default_parameter
      all:
        - has: { field: name, regex: "^timeout$" }
        - has: { field: value, pattern: $V, matches: bound-value }
    - kind: typed_default_parameter
      all:
        - has: { field: name, regex: "^timeout$" }
        - has: { field: value, pattern: $V, matches: bound-value }
---
# asyncio.wait_for(aw, N) / wait_for(aw, timeout=N): a condition wait.
id: literal-bound.wait.condition
language: python
rule:
  any:
    - kind: call
      all:
        - has: { field: function, matches: wait-for }
        - has: { field: arguments, has: { nthChild: { position: 2, ofRule: { matches: positional } }, pattern: $V, all: [{ matches: positional }, { matches: bound-value }] } }
    - kind: keyword_argument
      all:
        - has: { field: name, regex: "^timeout$" }
        - has: { field: value, pattern: $V, matches: bound-value }
      inside: { kind: argument_list, inside: { kind: call, has: { field: function, matches: wait-for } } }
---
# async with asyncio.timeout(N): a condition wait.
id: literal-bound.timeout-ctx.condition
language: python
rule:
  kind: call
  all:
    - has: { field: function, regex: "^(?:asyncio|async_timeout)\\.timeout$" }
    - has: { field: arguments, has: { nthChild: { position: 1, ofRule: { matches: positional } }, pattern: $V, all: [{ matches: positional }, { matches: bound-value }] } }
---
# t.join(N) / p.join(timeout=N): a thread or process join. A positional value is read only as a numeric literal
# (", ".join(names) is str.join).
id: literal-bound.join.subprocess
language: python
rule:
  any:
    - kind: call
      all:
        - has: { field: function, kind: attribute, has: { field: attribute, regex: "^join$" } }
        - has: { field: arguments, has: { nthChild: { position: 1, ofRule: { matches: positional } }, pattern: $V, matches: number-literal } }
    - kind: keyword_argument
      all:
        - has: { field: name, regex: "^timeout$" }
        - has: { field: value, pattern: $V, matches: bound-value }
      inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, has: { field: attribute, regex: "^join$" } } } }
---
# A PostgreSQL client's timeout / connect_timeout / command_timeout (vagary-core #949's fixture bounds).
id: literal-bound.client.fixture
language: python
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: "^(?:timeout|connect_timeout|command_timeout)$" }
    - has: { field: value, pattern: $V, matches: bound-value }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, matches: pg-call } } }
---
# An HTTP client's timeout= against the system under test: a condition wait.
id: literal-bound.http.condition
language: python
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: "^timeout$" }
    - has: { field: value, pattern: $V, matches: bound-value }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, matches: http-call } } }
---
# @pytest.mark.timeout(N) / pytest.mark.timeout(timeout=N): a case bound.
id: literal-bound.mark.case
language: python
rule:
  any:
    - kind: call
      all:
        - has: { field: function, regex: "^pytest\\.mark\\.timeout$" }
        - has: { field: arguments, has: { nthChild: { position: 1, ofRule: { matches: positional } }, pattern: $V, all: [{ matches: positional }, { matches: bound-value }] } }
    - kind: keyword_argument
      all:
        - has: { field: name, regex: "^timeout$" }
        - has: { field: value, pattern: $V, matches: bound-value }
      inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: "^pytest\\.mark\\.timeout$" } } }
---
# A poll loop's budget (K2 step 2C, B): N x V for `for _ in range(N)`, V for a deadline loop.
id: literal-bound.poll.condition
language: python
rule:
  all:
    - any:
        - kind: for_statement
          all:
            - has: { field: right, kind: call, all: [{ has: { field: function, regex: "^range$" } }, { has: { field: arguments, all: [{ has: { nthChild: 1, all: [{ pattern: $N }, { not: { matches: py-param-count } }] } }, { not: { has: { nthChild: 2 } } }] } }] }
            - has: { field: body, has: { stopBy: { matches: poll-boundary }, matches: py-sleep } }
            - has: { field: body, has: { stopBy: { matches: poll-boundary }, matches: py-exit } }
        - all:
            - kind: while_statement
            - has: { field: condition, any: [{ matches: py-deadline-test }, { has: { stopBy: end, matches: py-deadline-test } }] }
