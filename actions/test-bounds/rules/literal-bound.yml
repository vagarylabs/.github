# literal-bound, for typescript (.ts .mts .cts), tsx (.tsx) and javascript (.js .mjs .cjs .jsx). check.py emits each
# rule once per language, with its `language:` line set; a line tagged `#[lang,...]` is kept only for those
# languages, since the grammars differ (tsx has no `<T>x` assertion, javascript no type wrappers and no
# required_parameter). The first document holds the utils every rule carries. The positions are vagaris's ratchet's
# (scripts/check-test-bounds-are-hang-guards.mjs, root R4'd on #849), each split by the floor kind it is judged
# against:
#   case: it/test/bench/describe* bounds, testTimeout;  hook: hook bounds, hookTimeout, teardownTimeout;
#   subprocess: the `timeout` option of a child-process call (spawn/exec/execFile/fork and their Sync forms, execa*);
#   condition: every other call's `timeout` option, vi.waitFor/waitUntil, and timeout/deadline/budget defaults.
# A rule only MATCHES a bound position and captures its value as $V. check.py decides whether $V is a finding: only
# a value proven at or above the kind's floor is cleared (README.md: the resolver).
# Every rule id is `literal-bound.<position>.<kind>`; check.py reads the kind from the id.
utils:
  nc: { not: { kind: comment } }
  # it/test/bench/describe*, then .each/.only/... modifiers, then calls: the ratchet's registrarName order (calls
  # are unwrapped first, so `describe.each(t)(...)` is a registrar and `it.each(t).only(...)` is not).
  case-mods:
    any:
      - { kind: identifier, regex: "^(?:it|test|bench|describe\\w*)$" }
      - kind: member_expression
        all:
          - has: { field: property, regex: "^(?:each|only|skip|concurrent|sequential|todo|fails|skipIf|runIf|for)$" }
          - has: { field: object, matches: case-mods }
  case-callee:
    any:
      - matches: case-mods
      - kind: call_expression
        has: { field: function, matches: case-callee }
  hook-mods:
    any:
      - { kind: identifier, regex: "^(?:beforeAll|beforeEach|afterAll|afterEach)$" }
      - kind: member_expression
        all:
          - has: { field: property, regex: "^(?:each|only|skip|concurrent|sequential|todo|fails|skipIf|runIf|for)$" }
          - has: { field: object, matches: hook-mods }
  hook-callee:
    any:
      - matches: hook-mods
      - kind: call_expression
        has: { field: function, matches: hook-callee }
  # A value that cannot be a time bound: the body, an options object, a string. Everything else in a bound position
  # (a literal, a name, a member, a call, arithmetic) is captured.
  bound-value:
    not:
      any:
        - { kind: arrow_function }
        - { kind: function_expression }
        - { kind: generator_function }
        - { kind: class }
        - { kind: object }
        - { kind: array }
        - { kind: string }
        - { kind: template_string }
        - { kind: regex }
        - { kind: spread_element }
        - { kind: "true" }
        - { kind: "false" }
        - { kind: "null" }
        - { kind: undefined }
        - { kind: comment }
  # The ratchet's isLiteral: a numeric literal, or + - * / and unary +/- built only of them, through type wrappers.
  literal-value:
    any:
      - { kind: number }
      - kind: unary_expression
        all:
          - has: { field: operator, regex: "^[-+]$" }
          - has: { field: argument, matches: literal-value }
      - kind: binary_expression
        all:
          - has: { field: operator, regex: "^[-+*/]$" }
          - has: { field: left, matches: literal-value }
          - has: { field: right, matches: literal-value }
      - kind: parenthesized_expression
        has: { matches: literal-value }
      - { kind: as_expression, has: { nthChild: 1, matches: literal-value } }  #[typescript,tsx]
      - { kind: satisfies_expression, has: { nthChild: 1, matches: literal-value } }  #[typescript,tsx]
      - { kind: non_null_expression, has: { nthChild: 1, matches: literal-value } }  #[typescript,tsx]
      - { kind: type_assertion, has: { nthChild: { position: 1, reverse: true }, matches: literal-value } }  #[typescript]
  # An object that is an argument of a CALL (not `new`), directly or through wrappers.
  call-arg:
    any:
      - inside: { kind: arguments, inside: { kind: call_expression } }
      - inside:
          any:
            - { kind: parenthesized_expression }
            - { kind: as_expression }  #[typescript,tsx]
            - { kind: satisfies_expression }  #[typescript,tsx]
            - { kind: non_null_expression }  #[typescript,tsx]
            - { kind: type_assertion }  #[typescript]
          matches: call-arg
  timeout-key: { regex: "^(?:timeout|\"timeout\"|'timeout')$" }
  # A child-process launcher, called bare or as a member (child_process.spawnSync, cp.execFile).
  subprocess-name: { regex: "^(?:spawn|spawnSync|exec|execSync|execFile|execFileSync|fork|execa|execaSync|execaCommand|execaCommandSync|execaNode)$" }
  subprocess-callee:
    any:
      - { kind: identifier, matches: subprocess-name }
      - { kind: member_expression, has: { field: property, matches: subprocess-name } }
  bound-name: { kind: identifier, regex: "(?i)timeout|deadline|budget" }
  # Matchers that compare an expected VALUE (`expect(x).toEqual({ timeout: 12_345 })`): an object passed to one is
  # data, never a bound (the vagaris hardening branch, f2961a44f). Playwright's web-first assertions (toBeVisible,
  # toHaveURL, toPass) take a real bound and are not on this list.
  equality-matcher: { regex: "^(?:toEqual|toStrictEqual|toMatchObject|toContainEqual|toHaveBeenCalledWith|toHaveBeenLastCalledWith|toHaveBeenNthCalledWith|toHaveProperty|toBe)$" }
  # A registrar call carries its body (a function, or a name or member for one) beside the bound: `describeExit("wsl",
  # 4)` names a describe-like helper but registers nothing (f2961a44f).
  registrar-body:
    all:
      - any:
          - { kind: arrow_function }
          - { kind: function_expression }
          - { kind: identifier }
          - { kind: member_expression }
      - not: { nthChild: { position: 1, reverse: true, ofRule: { matches: nc } } }
  # Poll loops (K2 step 2C, B): a loop that re-checks a condition between fixed sleeps is judged by its BUDGET, never
  # by its step. A counted loop (`for (let i = 0; i < N; i++)`) whose body awaits one fixed sleep ($V ms) and can exit
  # early (break or return) has the budget N x V. A deadline loop's budget is D, from `now - start < D`, or from
  # `now < deadline` with `deadline = now + D` in a preceding statement. A budget that is a parameter of the
  # enclosing function is judged where it is declared (its default is literal-bound.default.condition), not here.
  poll-boundary:
    any:
      - kind: arrow_function
      - kind: function_expression
      - kind: function_declaration
      - kind: generator_function
      - kind: generator_function_declaration
      - kind: method_definition
      - kind: class_declaration
      - kind: class
  poll-def: { any: [{ kind: function_declaration }, { kind: generator_function_declaration }, { kind: class_declaration }] }
  timer-call:
    kind: call_expression
    all:
      - has: { field: function, regex: "^(?:(?:window|globalThis)\\.)?setTimeout$" }
      - has: { field: arguments, has: { nthChild: 2, all: [{ pattern: $V }, { not: { matches: param-budget } }] } }
  fixed-sleep:
    kind: await_expression
    has:
      any:
        - all: [{ kind: call_expression }, { has: { field: function, regex: "^(?:sleep|delay|wait|pause)$" } }, { has: { field: arguments, has: { nthChild: 1, all: [{ pattern: $V }, { not: { matches: param-budget } }] } } }]
        - all:
            - kind: new_expression
            - has: { field: constructor, regex: "^Promise$" }
            - has: { field: arguments, has: { nthChild: 1, kind: arrow_function, has: { field: body, any: [{ matches: timer-call }, { has: { stopBy: end, matches: timer-call } }] } } }
  early-exit: { any: [{ kind: break_statement }, { kind: return_statement }] }
  poll-now: { any: [{ pattern: Date.now() }, { pattern: performance.now() }] }
  counter-test:
    kind: binary_expression
    all: [{ has: { field: left, pattern: $I } }, { has: { field: operator, regex: "^<$" } }, { has: { field: right, all: [{ pattern: $N }, { not: { matches: param-count } }] } }]
  now-plus:
    kind: binary_expression
    all:
      - has: { field: operator, regex: "^\\+$" }
      - any:
          - all: [{ has: { field: left, matches: poll-now } }, { has: { field: right, all: [{ pattern: $V }, { not: { matches: param-budget } }] } }]
          - all: [{ has: { field: left, all: [{ pattern: $V }, { not: { matches: param-budget } }] } }, { has: { field: right, matches: poll-now } }]
  deadline-binding:
    any:
      - all: [{ kind: variable_declarator }, { has: { field: name, pattern: $D } }, { has: { field: value, matches: now-plus } }]
      - all: [{ kind: assignment_expression }, { has: { field: left, pattern: $D } }, { has: { field: right, matches: now-plus } }]
  deadline-test:
    kind: binary_expression
    all:
      - has: { field: operator, regex: "^<=?$" }
      - any:
          - all: [{ has: { field: left, kind: binary_expression, all: [{ has: { field: operator, regex: "^-$" } }, { has: { field: left, matches: poll-now } }] } }, { has: { field: right, all: [{ pattern: $V }, { not: { matches: param-budget } }] } }]
          - all:
              - has: { field: left, matches: poll-now }
              - has: { field: right, kind: identifier, pattern: $D }
              - inside: { stopBy: end, follows: { stopBy: end, not: { matches: poll-def }, has: { stopBy: { matches: poll-boundary }, matches: deadline-binding } } }
  param-budget:
    all:
      - kind: identifier
      - inside: { stopBy: end, matches: poll-boundary, any: [{ has: { field: parameters, has: { stopBy: end, pattern: $V } } }, { has: { field: parameter, pattern: $V } }] }
  param-count:
    all:
      - kind: identifier
      - inside: { stopBy: end, matches: poll-boundary, any: [{ has: { field: parameters, has: { stopBy: end, pattern: $N } } }, { has: { field: parameter, pattern: $N } }] }
  # Fixed flushes (the vagaris hardening branch, 45d7d8996; root accepted the class 10-30, lanes/cli/BATCH-B-ui): a
  # fixed count of event-loop turns OUTSIDE React's own act() is a disguised time bound. React renders through its
  # time-sliced scheduler and react-query batches through setTimeout(0), so the turns a render needs grow with load.
  # Inside an act imported from React, the work is flushed before act returns (deterministic).
  # A zero turn: setTimeout(fn) / setTimeout(fn, 0) (window./globalThis./global.), or setImmediate.
  zero-timer:
    kind: call_expression
    any:
      - all:
          - has: { field: function, regex: "^(?:(?:window|globalThis|global)\\.)?setTimeout$" }
          - has: { field: arguments, any: [{ not: { has: { nthChild: 2 } } }, { has: { nthChild: 2, regex: "^0$" } }] }
      - has: { field: function, regex: "^(?:(?:window|globalThis|global)\\.)?setImmediate$" }
  # act imported from React (react, react-dom/test-utils, react-test-renderer, @testing-library/react); $ACT is its
  # local name, aliased or not.
  react-act-spec:
    kind: import_specifier
    all:
      - has: { field: name, regex: "^act$" }
      - any:
          - has: { field: alias, pattern: $ACT }
          - all: [{ not: { has: { field: alias, kind: identifier } } }, { has: { field: name, pattern: $ACT } }]
  # A top-level import of act from React (a direct child of the program, so the program is never searched whole).
  react-act-import:
    kind: import_statement
    all:
      - has: { field: source, regex: "^[\"'](?:react|react-dom/test-utils|react-test-renderer|@testing-library/react)[\"']$" }
      - has: { stopBy: end, matches: react-act-spec }
  sheltered:
    inside:
      stopBy: end
      kind: call_expression
      all:
        - has: { field: function, kind: identifier, pattern: $ACT }
        - inside: { stopBy: end, kind: program, has: { matches: react-act-import } }
  open-turn: { all: [{ matches: zero-timer }, { not: { matches: sheltered } }] }
  ff-fn: { any: [{ kind: arrow_function }, { kind: function_expression }, { kind: function_declaration }] }
---
# { timeout: V } in a call's arguments; the call decides the kind.
id: literal-bound.option.case
language: typescript
rule:
  any:
    - kind: pair
      all:
        - has: { field: key, matches: timeout-key }
        - has: { field: value, pattern: $V, matches: bound-value }
    - { kind: shorthand_property_identifier, regex: "^timeout$", pattern: $V }
  inside:
    kind: object
    matches: call-arg
    inside:
      stopBy: { kind: call_expression }
      kind: call_expression
      has: { field: function, matches: case-callee }
---
id: literal-bound.option.hook
language: typescript
rule:
  any:
    - kind: pair
      all:
        - has: { field: key, matches: timeout-key }
        - has: { field: value, pattern: $V, matches: bound-value }
    - { kind: shorthand_property_identifier, regex: "^timeout$", pattern: $V }
  inside:
    kind: object
    matches: call-arg
    inside:
      stopBy: { kind: call_expression }
      kind: call_expression
      has: { field: function, matches: hook-callee }
---
# A child process's `timeout` option (spawnSync(cmd, args, { timeout })): the subprocess floor, as in Python.
id: literal-bound.option.subprocess
language: typescript
rule:
  any:
    - kind: pair
      all:
        - has: { field: key, matches: timeout-key }
        - has: { field: value, pattern: $V, matches: bound-value }
    - { kind: shorthand_property_identifier, regex: "^timeout$", pattern: $V }
  inside:
    kind: object
    matches: call-arg
    inside:
      stopBy: { kind: call_expression }
      kind: call_expression
      has: { field: function, matches: subprocess-callee }
---
id: literal-bound.option.condition
language: typescript
rule:
  any:
    - kind: pair
      all:
        - has: { field: key, matches: timeout-key }
        - has: { field: value, pattern: $V, matches: bound-value }
    - { kind: shorthand_property_identifier, regex: "^timeout$", pattern: $V }
  inside:
    kind: object
    matches: call-arg
    inside:
      stopBy: { kind: call_expression }
      kind: call_expression
      # $F: the callee, so check.py can resolve an aliased child process (`spawnSync as run`, promisify(execFile))
      has: { field: function, pattern: $F }
      not:
        any:
          - has:
              field: function
              any: [{ matches: case-callee }, { matches: hook-callee }, { matches: subprocess-callee }]
          - has: { field: function, kind: member_expression, has: { field: property, matches: equality-matcher } }
---
# The LAST argument of it/test/bench/describe*: any bound value with 3+ arguments (name, fn, timeout), only a literal
# with 2 (the ratchet's rule; a 2-argument call's last argument is otherwise its body).
id: literal-bound.registrar.case
language: typescript
rule:
  kind: call_expression
  all:
    - has: { field: function, matches: case-callee }
    - has:
        field: arguments
        has: { nthChild: { position: 1, reverse: true, ofRule: { matches: nc } }, pattern: $V, matches: bound-value }
    - has: { field: arguments, has: { matches: registrar-body } }
    - has:
        field: arguments
        any:
          - has: { nthChild: { position: 3, ofRule: { matches: nc } } }
          - all:
              - has: { nthChild: { position: 2, ofRule: { matches: nc } } }
              - has: { nthChild: { position: 1, reverse: true, ofRule: { matches: nc } }, matches: literal-value }
---
# The LAST argument of a hook (fn, timeout), including the optional call `beforeAll?.(fn, N)` (#855 L1).
id: literal-bound.registrar.hook
language: typescript
rule:
  kind: call_expression
  all:
    - has: { field: function, matches: hook-callee }
    - has:
        field: arguments
        has: { nthChild: { position: 1, reverse: true, ofRule: { matches: nc } }, pattern: $V, matches: bound-value }
    - has: { field: arguments, has: { matches: registrar-body } }
    - has:
        field: arguments
        has: { nthChild: { position: 2, ofRule: { matches: nc } } }
---
# vi.waitFor(fn, N) / vi.waitUntil(fn, N): the second argument (an options object is literal-bound.option.condition).
id: literal-bound.wait.condition
language: typescript
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        all:
          - has: { field: object, kind: identifier, regex: "^vi$" }
          - has: { field: property, regex: "^(?:waitFor|waitUntil)$" }
    - has:
        field: arguments
        has: { nthChild: { position: 2, ofRule: { matches: nc } }, pattern: $V, matches: bound-value }
---
# A parameter default named like a bound: (timeoutMs = 15000).
id: literal-bound.default.condition
language: typescript
rule:
  any:
    - { kind: required_parameter, all: [{ has: { field: pattern, matches: bound-name } }, { has: { field: value, pattern: $V, matches: bound-value } }] }  #[typescript,tsx]
    - { kind: optional_parameter, all: [{ has: { field: pattern, matches: bound-name } }, { has: { field: value, pattern: $V, matches: bound-value } }] }  #[typescript,tsx]
    - { kind: assignment_pattern, inside: { kind: formal_parameters }, all: [{ has: { field: left, matches: bound-name } }, { has: { field: right, pattern: $V, matches: bound-value } }] }  #[javascript]
---
id: literal-bound.config.case
language: typescript
rule:
  any:
    - kind: pair
      all:
        - has: { field: key, regex: "^(?:testTimeout|\"testTimeout\"|'testTimeout')$" }
        - has: { field: value, pattern: $V, matches: bound-value }
    - { kind: shorthand_property_identifier, regex: "^testTimeout$", pattern: $V }
---
id: literal-bound.config.hook
language: typescript
rule:
  any:
    - kind: pair
      all:
        - has: { field: key, regex: "^(?:hookTimeout|teardownTimeout|\"hookTimeout\"|\"teardownTimeout\"|'hookTimeout'|'teardownTimeout')$" }
        - has: { field: value, pattern: $V, matches: bound-value }
    - { kind: shorthand_property_identifier, regex: "^(?:hookTimeout|teardownTimeout)$", pattern: $V }
---
# A PostgreSQL client's connection/statement/query timeout option (node-postgres; vagary-core #949's JS_MS_KEYS),
# in any object (new Pool({...}), a config literal): the fixture floor.
id: literal-bound.client.fixture
language: typescript
rule:
  any:
    - kind: pair
      all:
        - has: { field: key, regex: "^(?:connectionTimeoutMillis|statement_timeout|query_timeout|\"(?:connectionTimeoutMillis|statement_timeout|query_timeout)\"|'(?:connectionTimeoutMillis|statement_timeout|query_timeout)')$" }
        - has: { field: value, pattern: $V, matches: bound-value }
    - { kind: shorthand_property_identifier, regex: "^(?:connectionTimeoutMillis|statement_timeout|query_timeout)$", pattern: $V }
---
# A poll loop's budget (K2 step 2C, B): N x V for a counted loop, V for a deadline loop (see the poll utils).
id: literal-bound.poll.condition
language: typescript
rule:
  all:
    - any:
        - kind: for_statement
          all:
            - has: { field: initializer, any: [{ kind: lexical_declaration }, { kind: variable_declaration }], has: { kind: variable_declarator, all: [{ has: { field: name, pattern: $I } }, { has: { field: value, regex: "^0$" } }] } }
            - has: { field: condition, any: [{ matches: counter-test }, { has: { stopBy: end, matches: counter-test } }] }
            - has: { field: increment, any: [{ pattern: $I++ }, { pattern: ++$I }, { pattern: $I += 1 }] }
            - has: { field: body, has: { stopBy: { matches: poll-boundary }, matches: fixed-sleep } }
            - any:
                - has: { field: body, has: { stopBy: { matches: poll-boundary }, matches: early-exit } }
                - has: { field: condition, kind: binary_expression, has: { field: operator, regex: "^&&$" } }
        - all:
            - any: [{ kind: while_statement }, { kind: do_statement }, { kind: for_statement }]
            - has: { field: condition, any: [{ matches: deadline-test }, { has: { stopBy: end, matches: deadline-test } }] }
---
# A deadline option passed INTO the code under test (the vagaris hardening branch, 4862e5050, from #835's drain red):
# a property of an options object in a call's arguments whose key matches /(?:timeout|deadline|budget)\w*Ms$/i
# (drainTimeoutMs, deadlineMs, budgetMs), outside the equality matchers. A literal zero is "none" (check.py), and a
# shorthand `{ deadlineMs }` is not read, as in the ratchet.
id: literal-bound.deadline-option.condition
language: typescript
rule:
  kind: pair
  all:
    - has: { field: key, regex: "(?i)^[\"']?\\w*(?:timeout|deadline|budget)\\w*ms[\"']?$" }
    - has: { field: value, pattern: $V, matches: bound-value }
  inside:
    kind: object
    matches: call-arg
    inside:
      stopBy: { kind: call_expression }
      kind: call_expression
      not: { has: { field: function, kind: member_expression, has: { field: property, matches: equality-matcher } } }
---
# Fixed-flush facts (ff-call runs in a second scan, only over files that define a turn helper): a named function whose body (callbacks included) makes an unsheltered zero turn. check.py closes
# the set over calls (a helper that calls a turn helper is one) and keeps an awaited zero-argument call of one that
# sits directly in a test or hook callback.
id: ff-turn-def
language: typescript
rule:
  kind: identifier
  any:
    - inside: { kind: function_declaration, field: name, has: { field: body, has: { stopBy: end, matches: open-turn } } }
    - inside:
        kind: variable_declarator
        field: name
        has:
          field: value
          all:
            - any: [{ kind: arrow_function }, { kind: function_expression }]
            - has: { field: body, any: [{ matches: open-turn }, { has: { stopBy: end, matches: open-turn } }] }
---
id: ff-call
language: typescript
rule:
  kind: call_expression
  all:
    - has: { field: function, kind: identifier, pattern: $C }
    - inside:
        stopBy: end
        any:
          - all: [{ kind: function_declaration }, { has: { field: name, pattern: $F } }]
          - all: [{ kind: variable_declarator }, { has: { field: name, pattern: $F } }, { has: { field: value, any: [{ kind: arrow_function }, { kind: function_expression }] } }]
    - not: { matches: sheltered }
---
# An awaited zero-argument call ($V, the callee's name) directly in a test or hook callback: a fixed flush when $V is a
# turn helper (check.py). Judged by its shape, never by a value.
id: fixed-flush.turn.condition
language: typescript
rule:
  kind: call_expression
  all:
    - has: { field: function, kind: identifier, pattern: $V }
    - has: { field: arguments, regex: "^\\(\\s*\\)$" }
    - inside: { kind: await_expression }
    - inside:
        stopBy: { matches: ff-fn }
        matches: ff-fn
        inside: { kind: arguments, inside: { kind: call_expression, has: { field: function, any: [{ matches: case-callee }, { matches: hook-callee }] } } }
